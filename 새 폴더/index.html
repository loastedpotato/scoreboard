<!DOCTYPE html>
<html lang="ko" class="dark"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FIBA Scorer">
  <title>FIBA 공식 농구 경기 기록원 시스템 (PWA Offline-First)</title>

  <!-- 정적 호스팅 배포 시 자동 연결되는 PWA Manifest -->
  <link rel="manifest" href="blob:null/f2d3d1b6-e1b9-4b8b-ad87-9ab660031b2b" id="pwa-manifest-link">

  <!-- Google Fonts: Noto Sans KR & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Core Libraries (React 18 UMD, Babel Standalone, html2pdf.js, qrcode-generator, MQTT.js) -->
  <script crossorigin="" src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin="" src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <!-- 환경 감지 및 전역 런타임 에러 모니터 -->
  <script>
    (function () {
      try {
        var isSandboxed = false;
        try {
          if (window.self !== window.top) isSandboxed = true;
        } catch (e) {
          isSandboxed = true;
        }
        var host = (window.location && window.location.hostname) || '';
        if (
          host.indexOf('usercontent.goog') !== -1 ||
          host.indexOf('googleusercontent.com') !== -1 ||
          window.location.protocol === 'blob:' ||
          window.location.protocol === 'about:'
        ) {
          isSandboxed = true;
        }
        window.__FIBA_CANVAS_SANDBOX__ = isSandboxed;
      } catch (err) {
        window.__FIBA_CANVAS_SANDBOX__ = true;
      }

      window.addEventListener('error', function (ev) {
        var rootEl = document.getElementById('root');
        if (rootEl && rootEl.getAttribute('data-mounted') !== 'true') {
          var errBox = document.getElementById('boot-error-box');
          if (errBox) {
            errBox.style.display = 'block';
            errBox.textContent = '런타임 오류 감지: ' + (ev.message || '알 수 없는 스크립트 오류');
          }
        }
      });
    })();
  </script>

  <!-- Babel 변환 충돌을 피하기 위한 순수 ES Module Firebase 로더 브릿지 -->
  <script type="module">
    window.__loadFirebaseModules = async function () {
      const [appMod, authMod, firestoreMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
      ]);
      return { appMod, authMod, firestoreMod };
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #070b14;
      color: #f1f5f9;
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>

      { number: '30', name: '박무빈' }, { number: '33', name: '이우석' }, { number: '44', name: '강상재' }
    ];

    function createEmptyStats() {
      return {
        pts: 0,
        ftm: 0, fta: 0,
        twopm: 0, twopa: 0,
        threepm: 0, threepa: 0,
        oreb: 0, dreb: 0, reb: 0,

    function createInitialAppState() {
      const buildPlayers = (prefix, list) =>
        list.map((p, idx) => ({
          playerId: `${prefix}_${String(idx + 1).padStart(2, '0')}`,

    function isValidSchema(obj) {
      return Boolean(
        obj &&
        obj.gameInfo &&
        obj.teams &&
        obj.teams.HOME &&
        obj.teams.AWAY &&
        obj.runningScore &&
        Array.isArray(obj.playByPlay)
      );

    // ============================================================================
    // 2. 순수 도메인 헬퍼 함수 (FIBA 룰 검증, 역연산, 경량 스냅샷, 포맷터)
    // ============================================================================
    function getQuarterLabel(qNum) {
      return QUARTER_LABELS[(qNum || 1) - 1] || 'Q1';
    }

    // FIBA 규정: 4쿼터 누적 팀 파울은 연장전(OT, quarter=5)으로 자동 승계
    function getFoulQuarterIndex(qNum) {
      return qNum >= 4 ? 3 : Math.max(0, qNum - 1);
    }

    function getCurrentTeamFouls(state, teamKey, qNum) {
      const idx = getFoulQuarterIndex(qNum);
      return state.gameInfo.teamFouls[teamKey][idx] || 0;
    }

    function incrementTeamFoulInPlace(state, teamKey, qNum, delta) {
      const idx = getFoulQuarterIndex(qNum);
      const nextVal = Math.max(0, (state.gameInfo.teamFouls[teamKey][idx] || 0) + delta);
      state.gameInfo.teamFouls[teamKey][idx] = nextVal;
      if (qNum >= 4) {
        state.gameInfo.teamFouls[teamKey][4] = nextVal;
      }
      return nextVal;
    }

    // FIBA 개인 5반칙 또는 U/T 파울 합산 2회 누적 시 실격(GD) 판정
    function evaluatePlayerDisqualification(player) {
      const totalFouls = player.foulHistory.length;
      const utCount = player.foulHistory.filter(c => c === 'U' || c === 'T').length;
      if (utCount >= 2) {
        player.isDisqualified = true;
        player.disqualifyReason = 'U/T 파울 2회 누적 실격 퇴장 (GD)';
      } else if (totalFouls >= 5) {
        player.isDisqualified = true;
        player.disqualifyReason = '개인 5반칙 퇴장';
      } else {
        player.isDisqualified = false;
        player.disqualifyReason = null;
      }
    }

    // 이벤트 로그 스택(playByPlay) 기반 전체 상태 완벽 역연산(Rebuild) 엔진
    function rebuildStateFromEvents(baseState, eventsList) {
      const next = JSON.parse(JSON.stringify(baseState));
      ['HOME', 'AWAY'].forEach(tKey => {
        next.teams[tKey].totalScore = 0;
        next.teams[tKey].players.forEach(p => {
          p.stats = createEmptyStats();
          p.foulHistory = [];
          p.isDisqualified = false;
          p.disqualifyReason = null;
        });
      });
      next.gameInfo.quarterScores = { HOME: [0, 0, 0, 0, 0], AWAY: [0, 0, 0, 0, 0] };
      next.gameInfo.teamFouls = { HOME: [0, 0, 0, 0, 0], AWAY: [0, 0, 0, 0, 0] };
      next.runningScore = { HOME: [], AWAY: [] };
      next.playByPlay = [];

      eventsList.forEach(rawEv => {
        const ev = { ...rawEv };
        const tKey = ev.team;
        const teamObj = next.teams[tKey];
        const qIdx = (ev.quarter || 1) - 1;
        const player = teamObj.players.find(p => p.playerId === ev.playerId);
        const code = ev.actionCode;

        if (code === 'BENCH_TF') {
          incrementTeamFoulInPlace(next, tKey, ev.quarter, 1);
        } else if (player) {
          const s = player.stats;
          if (code === '1PM') { s.ftm += 1; s.fta += 1; s.pts += 1; }
          else if (code === '2PM') { s.twopm += 1; s.twopa += 1; s.pts += 2; }
          else if (code === '3PM') { s.threepm += 1; s.threepa += 1; s.pts += 3; }
          else if (code === '1PX') { s.fta += 1; }
          else if (code === '2PX') { s.twopa += 1; }
          else if (code === '3PX') { s.threepa += 1; }
          else if (code === 'DREB') { s.dreb += 1; s.reb += 1; }
          else if (code === 'OREB') { s.oreb += 1; s.reb += 1; }
          else if (code === 'AST') { s.ast += 1; }
          else if (code === 'STL') { s.stl += 1; }
          else if (code === 'BLK') { s.blk += 1; }
          else if (code === 'TOV') { s.tov += 1; }
          else if (code === 'PF' || code === 'UF' || code === 'TF') {
            s.pf += 1;
            player.foulHistory.push(ACTION_META[code].foulCode);
            evaluatePlayerDisqualification(player);
            incrementTeamFoulInPlace(next, tKey, ev.quarter, 1);
          }

          if (ev.pointsDelta > 0) {
            teamObj.totalScore += ev.pointsDelta;
            next.gameInfo.quarterScores[tKey][qIdx] += ev.pointsDelta;
            next.runningScore[tKey].push({
              targetScore: teamObj.totalScore,
              pointsAdded: ev.pointsDelta,
              playerNumber: player.number,
              shotType: code,
              quarter: ev.quarter
            });
          }
        }

        ev.scoreSnapshot = {
          HOME: next.teams.HOME.totalScore,
          AWAY: next.teams.AWAY.totalScore
        };
        next.playByPlay.push(ev);
      });

      return next;
    }

    function computeTeamTotals(state, teamKey) {
      const players = state.teams[teamKey].players;
      const totals = {
        pts: state.teams[teamKey].totalScore,
        twopm: 0, twopa: 0,
        threepm: 0, threepa: 0,
        ftm: 0, fta: 0,
        oreb: 0, dreb: 0, reb: 0,
        ast: 0, stl: 0, blk: 0, tov: 0, pf: 0
      };
      players.forEach(p => {
        const s = p.stats;
        totals.twopm += s.twopm; totals.twopa += s.twopa;
        totals.threepm += s.threepm; totals.threepa += s.threepa;
        totals.ftm += s.ftm; totals.fta += s.fta;
        totals.oreb += s.oreb; totals.dreb += s.dreb; totals.reb += s.reb;
        totals.ast += s.ast; totals.stl += s.stl; totals.blk += s.blk;
        totals.tov += s.tov; totals.pf += s.pf;
      });
      return totals;
    }

    function formatPct(made, att) {
      if (!att) return '0.0%';
      return ((made / att) * 100).toFixed(1) + '%';
    }

    // Canvas 샌드박스 또는 file:/// 환경 여부 감지
    function isRestrictedCanvasEnv() {
      if (window.__FIBA_CANVAS_SANDBOX__) return true;
      try {
        if (window.self !== window.top) return true;
        if (window.WebSocket && String(window.WebSocket).includes('Canvas')) return true;
      } catch (e) {
        return true;
      }
      return false;
    }

    function copyToClipboardSafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) return true;
      } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return true;
      }
      return false;
    }

    function generateServiceWorkerJsString() {
      return `// FIBA Official Scorer PWA Service Worker (Offline-First Asset Caching)
const CACHE_NAME = 'fiba-pro-scorer-pwa-v1';
const PRECACHE_ASSETS = [
  './',
  './index.html',
  './manifest.json',
  'https://cdn.tailwindcss.com',
  'https://unpkg.com/react@18.2.0/umd/react.production.min.js',

  'https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js'
];

self.addEventListener('install', (event) => {
  self.skipWaiting();
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) => {
      return Promise.allSettled(
        PRECACHE_ASSETS.map((url) =>
          fetch(url, { mode: 'cors' })
            .then((res) => {
              if (res && (res.status === 200 || res.type === 'opaque')) {
                return cache.put(url, res);
              }
            })
            .catch(() => {})
        )
      );
    })
  );
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((keys) =>
      Promise.all(
        keys.map((key) => {
          if (key !== CACHE_NAME) {
            return caches.delete(key);
          }
        })
      )
    ).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (event) => {
  const req = event.request;
  if (req.method !== 'GET') return;
  if (req.url.includes('firestore.googleapis.com') || req.url.includes('broker.emqx.io')) {
    return;
  }

  event.respondWith(
    caches.match(req).then((cachedResponse) => {
      const networkFetch = fetch(req)
        .then((networkResponse) => {
          if (networkResponse && (networkResponse.status === 200 || networkResponse.type === 'opaque')) {
            const clone = networkResponse.clone();
            caches.open(CACHE_NAME).then((cache) => cache.put(req, clone)).catch(() => {});
          }
          return networkResponse;
        })
        .catch(() => cachedResponse);

      return cachedResponse || networkFetch;
    })
  );
});
`;

    function downloadTextFile(filename, content, mimeType = 'text/plain;charset=utf-8;') {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);

                </tr>
              </tfoot>
            </table>
          </div>
        `;
      };

      const buildCompactRunningScoreGrid = (teamKey, accentColor) => {
        const list = (appState.runningScore && appState.runningScore[teamKey]) || [];
        const mapByScore = {};
        list.forEach(item => {
          mapByScore[item.targetScore] = item;
        });

        let cellsHtml = '';
        const maxScore = Math.max(80, Math.ceil((appState.teams[teamKey].totalScore + 10) / 20) * 20);
        for (let sc = 1; sc <= maxScore; sc++) {
          const hit = mapByScore[sc];
          let sym = '';
          let bg = '#ffffff';
          let borderCol = '#cbd5e1';
          if (hit) {
            sym = hit.shotType === '1PM' ? `●#${hit.playerNumber}` : hit.shotType === '2PM' ? `/#${hit.playerNumber}` : `⭕#${hit.playerNumber}`;
            bg = '#f0f9ff';
            borderCol = accentColor;
          }
          cellsHtml += `
            <div style="border:1px solid ${borderCol}; background:${bg}; padding:1px 2px; display:flex; align-items:center; justify-content:space-between; font-size:7.5px; font-family:monospace; line-height:1.1;">
              <span style="color:#64748b;">${sc}</span>
              <span style="font-weight:800; color:${accentColor};">${sym}</span>
            </div>
          `;
        }

        return `<div style="display:grid; grid-template-columns:repeat(10, 1fr); gap:1.5px;">${cellsHtml}</div>`;
      };

                  <td style="border:1px solid #334155; padding:2px 5px;">${qH[2]}</td>
                  <td style="border:1px solid #334155; padding:2px 5px;">${qH[3]}</td>
                  <td style="border:1px solid #334155; padding:2px 5px;">${qH[4]}</td>
                  <td style="border:1px solid #334155; padding:2px 7px; font-weight:900; background:#f0f9ff;">${hTeam.totalScore}</td>
                </tr>
                <tr>
                  <td style="border:1px solid #334155; padding:2px 7px; font-weight:800; text-align:left;">${aTeam.teamName}</td>
                  <td style="border:1px solid #334155; padding:2px 5px;">${qA[0]}</td>
                  <td style="border:1px solid #334155; padding:2px 5px;">${qA[1]}</td>
                  <td style="border:1px solid #334155; padding:2px 5px;">${qA[2]}</td>
                  <td style="border:1px solid #334155; padding:2px 5px;">${qA[3]}</td>
                  <td style="border:1px solid #334155; padding:2px 5px;">${qA[4]}</td>
                  <td style="border:1px solid #334155; padding:2px 7px; font-weight:900; background:#fff7ed;">${aTeam.totalScore}</td>
                </tr>
              </tbody>
            </table>
          </div>

          ${buildPaperTeamTable('HOME', '#0369a1')}
          ${buildPaperTeamTable('AWAY', '#c2410c')}

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:4px;">

            <span>보조기록원 (Assistant Scorer): ____________________ (서명)</span>
            <span>주심 (Crew Chief): ____________________ (서명)</span>
          </div>
        </div>
      `;
    }

                            {ev.scoreSnapshot.HOME} : {ev.scoreSnapshot.AWAY}
                          </div>
                        </div>
                      </div>
                    );
                  });
                })()}
              </div>
            </>
          )}

          {viewerUiState.activeTab === 'BOX' && (
            <>
              <div className="p-2.5 bg-slate-950/90 border-b border-slate-800 flex gap-2 shrink-0">
                <button
                  onClick={() => setViewerUiState(prev => ({ ...prev, boxScoreTeam: 'HOME' }))}
                  className={`flex-1 py-1.5 rounded-lg text-xs font-black transition ${
                    viewerUiState.boxScoreTeam === 'HOME'
                      ? 'bg-sky-500 text-slate-950 shadow'
                      : 'bg-slate-900 text-slate-400 border border-slate-800'
                  }`}
                >
                  {homeTeam.teamName} ({homeTeam.totalScore})
                </button>
                <button
                  onClick={() => setViewerUiState(prev => ({ ...prev, boxScoreTeam: 'AWAY' }))}
                  className={`flex-1 py-1.5 rounded-lg text-xs font-black transition ${
                    viewerUiState.boxScoreTeam === 'AWAY'
                      ? 'bg-orange-500 text-slate-950 shadow'
                      : 'bg-slate-900 text-slate-400 border border-slate-800'
                  }`}
                >
                  {awayTeam.teamName} ({awayTeam.totalScore})
                </button>
              </div>

              <div className="flex-1 overflow-auto">
                <table className="w-full text-left border-collapse text-[11px]">
                  <thead className="bg-slate-900/95 text-slate-400 sticky top-0 border-b border-slate-800 font-mono text-[10px]">
                    <tr>
                      <th className="py-2 pl-3 pr-2 font-sans">선수</th>
                      <th className="py-2 px-1.5 text-center text-white">PTS</th>
                      <th className="py-2 px-1.5 text-center">REB</th>
                      <th className="py-2 px-1.5 text-center">AST</th>
                      <th className="py-2 px-1.5 text-center">2P</th>
                      <th className="py-2 px-1.5 text-center">3P</th>
                      <th className="py-2 px-1.5 text-center">FT</th>
                      <th className="py-2 px-1.5 text-center">STL</th>
                      <th className="py-2 px-1.5 text-center">BLK</th>
                      <th className="py-2 px-2 text-center">PF</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/70 font-mono">
                    {appState.teams[viewerUiState.boxScoreTeam].players
                      .slice()
                      .sort((a, b) => b.stats.pts - a.stats.pts)
                      .map(p => {
                        const s = p.stats;
                        return (
                          <tr key={p.playerId} className={`hover:bg-slate-900/60 ${p.isDisqualified ? 'bg-rose-950/25' : ''}`}>
                            <td className="py-2 pl-3 pr-2 font-sans">
                              <div className="flex items-center gap-1.5">
                                <span className={`font-mono text-[10px] font-bold ${
                                  viewerUiState.boxScoreTeam === 'HOME' ? 'text-sky-400' : 'text-orange-400'
                                }`}>
                                  #{p.number}
                                </span>
                                <span className={`font-bold text-white truncate max-w-[85px] ${
                                  p.isDisqualified ? 'line-through text-rose-300' : ''
                                }`}>
                                  {p.name}
                                </span>
                                {p.isDisqualified && (
                                  <span className="px-1 py-0.2 text-[8px] font-black bg-rose-600 text-white rounded">퇴장</span>
                                )}
                              </div>
                            </td>
                            <td className="py-2 px-1.5 text-center font-black text-amber-300">{s.pts}</td>
                            <td className="py-2 px-1.5 text-center text-slate-200">{s.reb}</td>
                            <td className="py-2 px-1.5 text-center text-slate-200">{s.ast}</td>
                            <td className="py-2 px-1.5 text-center text-slate-400">{s.twopm}/${s.twopa}</td>
                            <td className="py-2 px-1.5 text-center text-slate-400">{s.threepm}/${s.threepa}</td>
                            <td className="py-2 px-1.5 text-center text-slate-400">{s.ftm}/${s.fta}</td>
                            <td className="py-2 px-1.5 text-center text-slate-400">{s.stl}</td>
                            <td className="py-2 px-1.5 text-center text-slate-400">{s.blk}</td>
                            <td className={`py-2 px-2 text-center font-bold ${s.pf >= 4 ? 'text-rose-400' : 'text-slate-300'}`}>
                              {s.pf}
                            </td>
                          </tr>
                        );
                      })}
                  </tbody>
                </table>
              </div>
            </>
          )}

          {viewerUiState.activeTab === 'TEAM' && (
            <div className="flex-1 overflow-y-auto p-3.5 space-y-3">
              {(() => {
                const hTot = computeTeamTotals(appState, 'HOME');
                const aTot = computeTeamTotals(appState, 'AWAY');
                const metrics = [
                  { label: '총 득점 (PTS)', hVal: hTot.pts, aVal: aTot.pts, hText: hTot.pts, aText: aTot.pts },
                  {
                    label: '2점슛 성공률 (2P%)',
                    hVal: hTot.twopa ? (hTot.twopm / hTot.twopa) * 100 : 0,
                    aVal: aTot.twopa ? (aTot.twopm / aTot.twopa) * 100 : 0,
                    hText: `${hTot.twopm}/${hTot.twopa} (${formatPct(hTot.twopm, hTot.twopa)})`,
                    aText: `${aTot.twopm}/${aTot.twopa} (${formatPct(aTot.twopm, aTot.twopa)})`
                  },
                  {
                    label: '3점슛 성공률 (3P%)',
                    hVal: hTot.threepa ? (hTot.threepm / hTot.threepa) * 100 : 0,
                    aVal: aTot.threepa ? (aTot.threepm / aTot.threepa) * 100 : 0,
                    hText: `${hTot.threepm}/${hTot.threepa} (${formatPct(hTot.threepm, hTot.threepa)})`,
                    aText: `${aTot.threepm}/${aTot.threepa} (${formatPct(aTot.threepm, aTot.threepa)})`
                  },
                  {
                    label: '자유투 성공률 (FT%)',
                    hVal: hTot.fta ? (hTot.ftm / hTot.fta) * 100 : 0,
                    aVal: aTot.fta ? (aTot.ftm / aTot.fta) * 100 : 0,
                    hText: `${hTot.ftm}/${hTot.fta} (${formatPct(hTot.ftm, hTot.fta)})`,
                    aText: `${aTot.ftm}/${aTot.fta} (${formatPct(aTot.ftm, aTot.fta)})`
                  },
                  { label: '리바운드 (REB: 공격/수비)', hVal: hTot.reb, aVal: aTot.reb, hText: `${hTot.reb} (${hTot.oreb}/${hTot.dreb})`, aText: `${aTot.reb} (${aTot.oreb}/${aTot.dreb})` },
                  { label: '어시스트 (AST)', hVal: hTot.ast, aVal: aTot.ast, hText: hTot.ast, aText: aTot.ast },
                  { label: '스틸 / 가로채기 (STL)', hVal: hTot.stl, aVal: aTot.stl, hText: hTot.stl, aText: aTot.stl },
                  { label: '블록슛 (BLK)', hVal: hTot.blk, aVal: aTot.blk, hText: hTot.blk, aText: aTot.blk },
                  { label: '턴오버 (TOV)', hVal: hTot.tov, aVal: aTot.tov, hText: hTot.tov, aText: aTot.tov },
                  { label: '누적 개인파울 (PF)', hVal: hTot.pf, aVal: aTot.pf, hText: hTot.pf, aText: aTot.pf }
                ];

                return metrics.map(m => {
                  const sum = (m.hVal + m.aVal) || 1;
                  const hPct = m.hVal === 0 && m.aVal === 0 ? 50 : Math.round((m.hVal / sum) * 100);
                  const aPct = 100 - hPct;
                  return (
                    <div key={m.label} className="space-y-1">
                      <div className="flex items-center justify-between text-[11px] font-mono">
                        <span className="font-bold text-sky-400">{m.hText}</span>
                        <span className="font-sans font-bold text-slate-300 text-[11px]">{m.label}</span>
                        <span className="font-bold text-orange-400">{m.aText}</span>
                      </div>
                      <div className="w-full h-2 rounded-full bg-slate-900 overflow-hidden flex border border-slate-800">
                        <div className="bg-sky-500 transition-all duration-300" style={{ width: `${hPct}%` }} />
                        <div className="bg-orange-500 transition-all duration-300" style={{ width: `${aPct}%` }} />
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // 6. 메인 애플리케이션 컨테이너 컴포넌트 (FibaProScorerMain)
    // ============================================================================
    function FibaProScorerMain() {
      const [appState, setAppState] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (isValidSchema(parsed)) return parsed;
          }
        } catch (e) {}
        return createInitialAppState();
      });

      const [selectedPlayerRef, setSelectedPlayerRef] = useState({
        team: 'HOME',
        playerId: 'HOME_01'
      });

      const [activeModal, setActiveModal] = useState(null);
      const [pwaPreviewTab, setPwaPreviewTab] = useState('GUIDE');
      const [pwaInstallPrompt, setPwaInstallPrompt] = useState(null);
      const [swStatusText, setSwStatusText] = useState('오프라인 로컬 스토리지 보호 활성');
      const [fibaAlert, setFibaAlert] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [saveBadgeText, setSaveBadgeText] = useState('💾 오프라인 자동저장 활성');
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      const [viewerUiState, setViewerUiState] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return {
          activeTab: 'PBP',
          pbpQuarterFilter: 'ALL',
          boxScoreTeam: 'HOME',
          isStandaloneMode: params.get('mode') === 'viewer'
        };
      });

      const [cloudStatus, setCloudStatus] = useState({
        text: '⚡ 실시간 브로드캐스트 준비됨',
        tone: 'sky'
      });
      const [telemetry, setTelemetry] = useState({
        txCount: 0,
        rxCount: 0,
        lastPushTime: '대기 중'
      });
      const [customPublicBaseUrl, setCustomPublicBaseUrl] = useState(() => {
        return localStorage.getItem(CUSTOM_PUBLIC_URL_KEY) || '';
      });

      const [rosterDraft, setRosterDraft] = useState(null);
      const [jsonDraft, setJsonDraft] = useState('');
      const [liveGameIdInput, setLiveGameIdInput] = useState(appState.gameInfo.gameId);
      const [publicUrlInput, setPublicUrlInput] = useState(customPublicBaseUrl);

      const appStateRef = useRef(appState);
      appStateRef.current = appState;
      const viewerModeRef = useRef(viewerUiState.isStandaloneMode);
      viewerModeRef.current = viewerUiState.isStandaloneMode;

      const mqttClientRef = useRef(null);
      const firestoreDbRef = useRef(null);
      const firestoreUserRef = useRef(null);
      const unsubscribeFirestoreRef = useRef(null);
      const liveChannelRef = useRef(null);
      const lastPushedHashRef = useRef('');

      const showToast = useCallback((message, color = 'sky') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, color }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 2700);
      }, []);

      // PWA 설치 프롬프트 및 Service Worker 자동 등록 (http/https 배포 시에만 안전하게 등록)
      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setPwaInstallPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

        try {
          const manifestLink = document.getElementById('pwa-manifest-link');
          if (manifestLink && window.location.protocol === 'file:') {
            const blob = new Blob([generateManifestJsonString()], { type: 'application/manifest+json' });
            manifestLink.href = URL.createObjectURL(blob);
          }
        } catch (e) {}

        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
          navigator.serviceWorker
            .register('./sw.js')
            .then((reg) => {
              setSwStatusText(`🟢 Service Worker 캐싱 활성 (${reg.scope})`);
            })
            .catch(() => {
              setSwStatusText('⚡ 단일 파일 실행 모드 (sw.js 함께 배포 시 오프라인 캐싱 자동 활성화)');
            });
        }

        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      const triggerPwaInstall = useCallback(async () => {
        if (!pwaInstallPrompt) return;
        pwaInstallPrompt.prompt();
        const { outcome } = await pwaInstallPrompt.userChoice;
        if (outcome === 'accepted') {
          showToast('📲 FIBA 공식 기록원 앱 설치가 승인되었습니다!', 'emerald');
          setPwaInstallPrompt(null);
        }
      }, [pwaInstallPrompt, showToast]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlGameId = params.get('gameId');
        if (urlGameId && urlGameId.trim()) {
          setAppState(prev => ({
            ...prev,
            gameInfo: { ...prev.gameInfo, gameId: urlGameId.trim() }
          }));
          setLiveGameIdInput(urlGameId.trim());
        }
      }, []);

      const applyIncomingSnapshot = useCallback((rawStr, isFromSelf) => {
        if (isFromSelf && !viewerModeRef.current) return false;
        try {
          const parsed = typeof rawStr === 'string' ? JSON.parse(rawStr) : rawStr;
          if (parsed && parsed.gameInfo && parsed.teams && Array.isArray(parsed.playByPlay)) {
            setAppState(prev => ({
              gameInfo: parsed.gameInfo,
              teams: parsed.teams,
              runningScore: parsed.runningScore || prev.runningScore || { HOME: [], AWAY: [] },
              playByPlay: parsed.playByPlay
            }));
            const timeLabel = parsed.updatedTimeStr || new Date().toLocaleTimeString('ko-KR', { hour12: false });
            setTelemetry(t => ({ ...t, rxCount: t.rxCount + 1, lastPushTime: timeLabel }));
            setCloudStatus({ text: `🟢 실시간 수신 중 (${parsed.gameInfo.gameId})`, tone: 'emerald' });
            return true;
          }
        } catch (e) {}
        return false;
      }, []);

      const pushSnapshotToCloud = useCallback(async (stateToPush, isForced = false) => {
        if (!stateToPush?.gameInfo?.isLiveSync && !isForced) return false;

        const gameId = (stateToPush.gameInfo.gameId || 'FIBA-20261110-001').trim();
        const clientId = mqttClientRef.current?.options?.clientId || 'react_desk';
        const payload = buildLightweightLivePayload(stateToPush, clientId);
        const serialized = JSON.stringify(payload);

        if (!isForced && serialized === lastPushedHashRef.current) {
          return true;
        }

        let sentSuccess = false;
        if (mqttClientRef.current && mqttClientRef.current.connected) {
          try {
            const cleanId = gameId.replace(/[^a-zA-Z0-9_-]/g, '_');
            const topic = `fiba_pro_live_v2/${cleanId}`;
            mqttClientRef.current.publish(topic, serialized, { qos: 1, retain: true });
            sentSuccess = true;
          } catch (e) {}
        }

        if (firestoreDbRef.current && firestoreUserRef.current && firestoreDbRef.current.doc && firestoreDbRef.current.setDoc) {
          try {
            const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'fiba-pro-scorer-app';
            const { db, doc, setDoc } = firestoreDbRef.current;
            const gameDocRef = doc(db, 'artifacts', envAppId, 'public', 'data', 'fiba_live_games', gameId);
            await setDoc(gameDocRef, {
              gameId,
              updatedAt: Date.now(),
              updatedTimeStr: payload.updatedTimeStr,
              updatedBy: firestoreUserRef.current.uid,
              serializedSnapshot: serialized
            });
            sentSuccess = true;
          } catch (e) {}
        }

        if (sentSuccess) {
          lastPushedHashRef.current = serialized;
          setTelemetry(t => ({ ...t, txCount: t.txCount + 1, lastPushTime: payload.updatedTimeStr }));
          setCloudStatus({ text: `🟢 실시간 송출 중 (${gameId})`, tone: 'emerald' });
          return true;
        }
        return false;
      }, []);

      useEffect(() => {
        if (!appState) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          const now = new Date().toLocaleTimeString('ko-KR', { hour12: false });
          setSaveBadgeText(`💾 오프라인 자동저장 완료 ${now}`);
        } catch (e) {}

        if (liveChannelRef.current && appState.gameInfo.isLiveSync) {
          try {
            liveChannelRef.current.postMessage({
              type: 'FIBA_LIVE_SYNC',
              fullState: appState
            });
          } catch (e) {}
        }

        if (!viewerUiState.isStandaloneMode && appState.gameInfo.isLiveSync) {
          const timer = setTimeout(() => {
            pushSnapshotToCloud(appState, false);
          }, 220);
          return () => clearTimeout(timer);
        }
      }, [appState, viewerUiState.isStandaloneMode, pushSnapshotToCloud]);

      // BroadcastChannel 및 LocalStorage 이벤트 초기화
      useEffect(() => {
        const handleStorageSync = (ev) => {
          if (ev.key === STORAGE_KEY && ev.newValue) {
            try {
              const parsed = JSON.parse(ev.newValue);
              if (parsed && parsed.gameInfo?.gameId === appStateRef.current.gameInfo?.gameId) {
                applyIncomingSnapshot(parsed, false);
              }
            } catch (e) {}
          }
        };
        window.addEventListener('storage', handleStorageSync);

        let ch = null;
        try {
          ch = new BroadcastChannel('fiba_live_scoreboard_channel');
          ch.onmessage = (ev) => {
            if (ev.data && ev.data.type === 'FIBA_LIVE_SYNC' && ev.data.fullState) {
              if (ev.data.fullState.gameInfo?.gameId === appStateRef.current.gameInfo?.gameId) {
                applyIncomingSnapshot(ev.data.fullState, false);
              }
            }
          };
          liveChannelRef.current = ch;
        } catch (e) {}

        return () => {
          window.removeEventListener('storage', handleStorageSync);
          if (ch) {
            try { ch.close(); } catch (e) {}
          }
        };
      }, [applyIncomingSnapshot]);

      // 무설정 WSS MQTT 릴레이 연결 (Canvas 샌드박스에서는 자동 우회)
      useEffect(() => {
        if (!window.mqtt) return;

        if (isRestrictedCanvasEnv()) {
          const gid = appStateRef.current.gameInfo.gameId || 'FIBA-20261110-001';
          setCloudStatus({
            text: `🟢 로컬/브라우저 라이브 동기화 활성 (${gid})`,
            tone: 'emerald'
          });
          return;
        }

        let client = null;
        try {
          const clientId = 'fiba_pwa_' + Math.random().toString(16).slice(2, 10);
          client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId,
            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 4000
          });
          mqttClientRef.current = client;

          const subscribeCurrentGame = () => {
            const gid = appStateRef.current.gameInfo.gameId || 'FIBA-20261110-001';
            const cleanId = gid.replace(/[^a-zA-Z0-9_-]/g, '_');
            const topic = `fiba_pro_live_v2/${cleanId}`;
            client.subscribe(topic, { qos: 1 });
            client.subscribe(`${topic}/req`, { qos: 0 });
            setCloudStatus({ text: `🟢 실시간 클라우드 연결됨 (${gid})`, tone: 'emerald' });

            if (viewerModeRef.current) {
              client.publish(`${topic}/req`, JSON.stringify({ type: 'REQ_SYNC', time: Date.now() }), { qos: 0 });
            } else if (appStateRef.current.gameInfo.isLiveSync) {
              pushSnapshotToCloud(appStateRef.current, true);
            }
          };

          client.on('connect', subscribeCurrentGame);
          client.on('error', () => {
            try { client.end(true); } catch (e) {}
          });
          client.on('message', (topic, message) => {
            try {
              const rawStr = message.toString();
              const parsed = JSON.parse(rawStr);
              if (topic.endsWith('/req') && parsed.type === 'REQ_SYNC') {
                if (!viewerModeRef.current && appStateRef.current.gameInfo.isLiveSync) {
                  pushSnapshotToCloud(appStateRef.current, true);
                }
                return;
              }
              if (parsed && parsed.gameInfo && parsed.teams) {
                const isSelf = parsed.senderClientId === clientId;
                applyIncomingSnapshot(rawStr, isSelf);
              }
            } catch (e) {}
          });
        } catch (err) {
          setCloudStatus({ text: '🟢 로컬 브로드캐스트 모드 활성', tone: 'emerald' });
        }

        return () => {
          if (client) {
            try { client.end(true); } catch (e) {}
          }
        };
      }, [applyIncomingSnapshot, pushSnapshotToCloud]);

      // Firebase Cloud Firestore 연결 (외부 모듈 로더 브릿지 사용)
      const initFirestoreConnection = useCallback(async () => {
        try {
          if (typeof window.__loadFirebaseModules !== 'function') return;
          let configObj = null;
          let isCustom = false;
          const customRaw = localStorage.getItem(CUSTOM_FIREBASE_CFG_KEY);
          if (customRaw) {
            const parsed = JSON.parse(customRaw);
            if (parsed && parsed.projectId) {
              configObj = parsed;
              isCustom = true;
            }
          }
          if (!configObj && typeof __firebase_config !== 'undefined' && __firebase_config) {
            const parsed = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            if (parsed && parsed.projectId) configObj = parsed;
          }
          if (!configObj) return;

          const { appMod, authMod, firestoreMod } = await window.__loadFirebaseModules();
          const { initializeApp, getApps } = appMod;
          const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = authMod;
          const { getFirestore, doc, setDoc, onSnapshot } = firestoreMod;

          const appName = isCustom ? 'fiba-react-custom' : '[DEFAULT]';
          const existing = getApps().find(a => a.name === appName);
          const appInstance = existing || initializeApp(configObj, appName === '[DEFAULT]' ? undefined : appName);
          const auth = getAuth(appInstance);
          const db = getFirestore(appInstance);
          firestoreDbRef.current = { db, doc, setDoc, onSnapshot };

          if (!isCustom && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (user) => {
            firestoreUserRef.current = user;
            if (!user) return;
            const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'fiba-pro-scorer-app';
            const gid = appStateRef.current.gameInfo.gameId || 'FIBA-20261110-001';
            const docRef = doc(db, 'artifacts', envAppId, 'public', 'data', 'fiba_live_games', gid);

            if (unsubscribeFirestoreRef.current) unsubscribeFirestoreRef.current();
            unsubscribeFirestoreRef.current = onSnapshot(
              docRef,
              (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                if (data?.serializedSnapshot) {
                  applyIncomingSnapshot(data.serializedSnapshot, data.updatedBy === user.uid);
                }
              },
              () => {}
            );
          });
        } catch (e) {}
      }, [applyIncomingSnapshot]);

      useEffect(() => {
        initFirestoreConnection();
        return () => {
          if (unsubscribeFirestoreRef.current) unsubscribeFirestoreRef.current();
        };
      }, [initFirestoreConnection]);

      const activePlayer = useMemo(() => {
        const teamObj = appState.teams[selectedPlayerRef.team];
        if (!teamObj) return null;
        return teamObj.players.find(p => p.playerId === selectedPlayerRef.playerId) || teamObj.players[0];
      }, [appState, selectedPlayerRef]);

      // ============================================================================
      // 7. 핵심 농구 기록 디스패처 & Undo 역연산 핸들러
      // ============================================================================
      const dispatchAction = useCallback((actionCode) => {
        setAppState(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          const teamKey = selectedPlayerRef.team;
          const teamObj = next.teams[teamKey];
          const player = teamObj.players.find(p => p.playerId === selectedPlayerRef.playerId) || teamObj.players[0];
          if (!player) return prev;

          if (player.isDisqualified) {
            setFibaAlert({
              title: '🚫 퇴장 선수 기록 불가',
              desc: `${teamObj.teamName} #${player.number} ${player.name} 선수는 이미 [${player.disqualifyReason}] 상태이므로 추가 기록을 입력할 수 없습니다.`
            });
            return prev;
          }

          const curQ = next.gameInfo.currentQuarter;
          const qIdx = curQ - 1;
          const meta = ACTION_META[actionCode];
          if (!meta) return prev;

          let pointsDelta = 0;
          let isTeamFoulPenalty = false;
          let isPlayerDisqualified = false;
          const s = player.stats;

          if (actionCode === '1PM') { s.ftm += 1; s.fta += 1; s.pts += 1; pointsDelta = 1; }
          else if (actionCode === '2PM') { s.twopm += 1; s.twopa += 1; s.pts += 2; pointsDelta = 2; }
          else if (actionCode === '3PM') { s.threepm += 1; s.threepa += 1; s.pts += 3; pointsDelta = 3; }
          else if (actionCode === '1PX') { s.fta += 1; }
          else if (actionCode === '2PX') { s.twopa += 1; }
          else if (actionCode === '3PX') { s.threepa += 1; }
          else if (actionCode === 'DREB') { s.dreb += 1; s.reb += 1; }
          else if (actionCode === 'OREB') { s.oreb += 1; s.reb += 1; }
          else if (actionCode === 'AST') { s.ast += 1; }
          else if (actionCode === 'STL') { s.stl += 1; }
          else if (actionCode === 'BLK') { s.blk += 1; }
          else if (actionCode === 'TOV') { s.tov += 1; }
          else if (actionCode === 'PF' || actionCode === 'UF' || actionCode === 'TF') {
            s.pf += 1;
            player.foulHistory.push(meta.foulCode);
            evaluatePlayerDisqualification(player);
            isPlayerDisqualified = player.isDisqualified;

            const newTeamFouls = incrementTeamFoulInPlace(next, teamKey, curQ, 1);
            if (newTeamFouls >= 5) isTeamFoulPenalty = true;
          }

          if (pointsDelta > 0) {
            teamObj.totalScore += pointsDelta;
            next.gameInfo.quarterScores[teamKey][qIdx] += pointsDelta;
            next.runningScore[teamKey].push({
              targetScore: teamObj.totalScore,
              pointsAdded: pointsDelta,
              playerNumber: player.number,
              shotType: actionCode,
              quarter: curQ
            });
          }

          const nowStr = new Date().toLocaleTimeString('ko-KR', { hour12: false });
          next.playByPlay.push({
            eventId: `evt_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            timestamp: nowStr,
            quarter: curQ,
            team: teamKey,
            playerId: player.playerId,
            playerNumber: player.number,
            playerName: player.name,
            actionCode,
            pointsDelta,
            isTeamFoulPenalty,
            isPlayerDisqualified,
            scoreSnapshot: {
              HOME: next.teams.HOME.totalScore,
              AWAY: next.teams.AWAY.totalScore
            },
            displayText: `[${getQuarterLabel(curQ)}] ${teamObj.teamName} #${player.number} ${player.name} — ${meta.label}`
          });

          if (isPlayerDisqualified && isTeamFoulPenalty) {
            setFibaAlert({
              title: '🚨 선수 퇴장 & 팀 파울 페널티 동시 발생!',
              desc: `#${player.number} ${player.name} 선수가 [${player.disqualifyReason}] 처리되었으며, ${teamObj.teamName} 팀 파울 5개 이상으로 상대 팀에 자유투 2구가 부여됩니다.`
            });
          } else if (isPlayerDisqualified) {
            setFibaAlert({
              title: `🚨 ${player.disqualifyReason}`,
              desc: `${teamObj.teamName} #${player.number} ${player.name} 선수가 파울 누적(${player.foulHistory.join(', ')})으로 즉시 코트에서 퇴장 처리되며 기록 버튼이 잠금됩니다.`
            });
          } else if (isTeamFoulPenalty) {
            setFibaAlert({
              title: '🚨 팀 파울 페널티 (자유투 부여)',
              desc: `${teamObj.teamName}의 ${getQuarterLabel(curQ)} 팀 파울이 5개 이상 누적되었습니다! 지금부터 발생하는 수비 파울 시 상대 팀에 자유투 2구가 부여됩니다.`
            });
          }

          return next;
        });
      }, [selectedPlayerRef]);

      const recordBenchFoul = useCallback((teamKey) => {
        setAppState(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          const curQ = next.gameInfo.currentQuarter;
          const teamObj = next.teams[teamKey];
          const newTeamFouls = incrementTeamFoulInPlace(next, teamKey, curQ, 1);
          const isTeamFoulPenalty = newTeamFouls >= 5;
          const nowStr = new Date().toLocaleTimeString('ko-KR', { hour12: false });

          next.playByPlay.push({
            eventId: `evt_${Date.now()}`,
            timestamp: nowStr,
            quarter: curQ,
            team: teamKey,
            playerId: null,
            playerNumber: 'B',
            playerName: '벤치/감독',
            actionCode: 'BENCH_TF',
            pointsDelta: 0,
            isTeamFoulPenalty,
            isPlayerDisqualified: false,
            scoreSnapshot: {
              HOME: next.teams.HOME.totalScore,
              AWAY: next.teams.AWAY.totalScore
            },
            displayText: `[${getQuarterLabel(curQ)}] ${teamObj.teamName} 벤치/팀 테크니컬 파울`
          });

          if (isTeamFoulPenalty) {
            setFibaAlert({
              title: '🚨 팀 파울 페널티 (자유투 부여)',
              desc: `${teamObj.teamName}의 ${getQuarterLabel(curQ)} 팀 파울이 5개 이상 누적되었습니다!`
            });
          } else {
            showToast(`⚠️ ${teamObj.teamName} 벤치/팀 파울이 기록되었습니다.`, 'amber');
          }

          return next;
        });
      }, [showToast]);

      const undoLastAction = useCallback(() => {
        setAppState(prev => {
          if (!prev.playByPlay.length) return prev;
          const removed = prev.playByPlay[prev.playByPlay.length - 1];
          const remaining = prev.playByPlay.slice(0, -1);
          const rebuilt = rebuildStateFromEvents(prev, remaining);
          showToast(`↩ 실행 취소 완료: ${removed.displayText}`, 'amber');
          return rebuilt;
        });
      }, [showToast]);

      // 글로벌 키보드 단축키 훅 (1,2,3 / Q,W,E 고정 매핑)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
          if (viewerUiState.isStandaloneMode || activeModal) return;

          if (fibaAlert) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
              e.preventDefault();
              setFibaAlert(null);
            }
            return;
          }

          if (e.key === 'Backspace') {
            e.preventDefault();
            undoLastAction();
            return;
          }

          const key = e.key.toUpperCase();
          const keyMap = {
            '1': '1PM', '2': '2PM', '3': '3PM',
            'Q': '1PX', 'W': '2PX', 'E': '3PX',
            'R': 'DREB', 'O': 'OREB', 'A': 'AST',
            'S': 'STL', 'B': 'BLK', 'T': 'TOV',
            'F': 'PF', 'U': 'UF', 'G': 'TF'
          };

          if (keyMap[key]) {
            e.preventDefault();
            dispatchAction(keyMap[key]);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [viewerUiState.isStandaloneMode, activeModal, fibaAlert, dispatchAction, undoLastAction]);

      // ============================================================================
      // 8. PDF 다운로드 (A4 Portrait 1페이지 자동 피팅) & CSV(Excel) 다운로드
      // ============================================================================
      const downloadOfficialScoresheetPDF = useCallback(async () => {
        if (!window.html2pdf) {
          showToast('⏳ PDF 엔진 로드 중입니다. 잠시 후 다시 시도해주세요.', 'amber');
          return;
        }

        setIsGeneratingPdf(true);
        showToast('📄 A4 세로형 1페이지 맞춤 공식 기록지 PDF를 생성 중입니다...', 'sky');

        const captureHost = document.createElement('div');
        captureHost.style.cssText = 'position:fixed; top:0; left:0; width:762px; background:#ffffff; z-index:99999; padding:0; margin:0; overflow:visible; box-sizing:border-box;';

        const sheetTarget = document.createElement('div');
        sheetTarget.style.cssText = 'width:762px; background:#ffffff; color:#0f172a; margin:0; padding:0; box-sizing:border-box;';
        sheetTarget.innerHTML = buildOfficialPaperScoresheetHTML(appState);

        captureHost.appendChild(sheetTarget);
        document.body.appendChild(captureHost);

        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          await new Promise(resolve => setTimeout(resolve, 200));

          const fullWidth = sheetTarget.scrollWidth || 762;
          const fullHeight = sheetTarget.scrollHeight || 1060;

          const worker = window.html2pdf().set({
            html2canvas: {
              scale: 2,
              useCORS: true,
              logging: false,
              backgroundColor: '#ffffff',
              x: 0,
              y: 0,
              scrollX: 0,
              scrollY: 0,
              width: fullWidth,
              height: fullHeight,
              windowWidth: fullWidth,
              windowHeight: fullHeight
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          }).from(sheetTarget);

          const canvas = await worker.toCanvas().get('canvas');
          const imgData = canvas.toDataURL('image/jpeg', 0.98);

          const pdf = await worker.toPdf().get('pdf');
          const pageW = 210;
          const pageH = 297;
          const margin = 6;
          const maxW = pageW - margin * 2;
          const maxH = pageH - margin * 2;

          const imgAspect = canvas.width / canvas.height;
          let renderW = maxW;
          let renderH = renderW / imgAspect;

          if (renderH > maxH) {
            renderH = maxH;
            renderW = renderH * imgAspect;
          }

          const offsetX = (pageW - renderW) / 2;
          const offsetY = margin;

          pdf.deletePage(1);
          pdf.addPage('a4', 'portrait');
          pdf.addImage(imgData, 'JPEG', offsetX, offsetY, renderW, renderH);
          pdf.save(`${appState.gameInfo.gameId}_FIBA_OFFICIAL_SCORESHEET.pdf`);

          showToast('✅ A4 세로 1페이지 공식 기록지 PDF 저장이 완료되었습니다!', 'emerald');
        } catch (err) {
          setActiveModal('PREVIEW_A4');
          showToast('⚠️ 프리뷰 창에서 프린터 인쇄(PDF로 저장)를 이용해주세요.', 'amber');
        } finally {
          if (captureHost && captureHost.parentNode) {
            captureHost.parentNode.removeChild(captureHost);
          }
          setIsGeneratingPdf(false);
        }
      }, [appState, showToast]);

      const exportBoxScoreCSV = useCallback(() => {
        const rows = [
          ['TEAM', 'NO', 'NAME', 'PTS', '2PM', '2PA', '3PM', '3PA', 'FTM', 'FTA', 'OREB', 'DREB', 'REB', 'AST', 'STL', 'BLK', 'TOV', 'PF', 'FOUL_HISTORY']
        ];
        ['HOME', 'AWAY'].forEach(tKey => {
          const teamName = appState.teams[tKey].teamName;
          appState.teams[tKey].players.forEach(p => {
            const s = p.stats;
            rows.push([
              teamName, p.number, p.name, s.pts,
              s.twopm, s.twopa, s.threepm, s.threepa, s.ftm, s.fta,
              s.oreb, s.dreb, s.reb, s.ast, s.stl, s.blk, s.tov, s.pf,
              p.foulHistory.join('-')
            ]);
          });
        });

        const csvContent = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
        downloadTextFile(`${appState.gameInfo.gameId}_BOXSCORE.csv`, csvContent, 'text/csv;charset=utf-8;');
        showToast('📥 전체 박스스코어 CSV(Excel) 파일 다운로드가 완료되었습니다.', 'emerald');
      }, [appState, showToast]);

      const viewerShareUrl = useMemo(() => {
        const savedBase = customPublicBaseUrl.trim();
        const baseUrl = savedBase ? savedBase.split('?')[0] : window.location.href.split('?')[0];
        const sep = baseUrl.includes('?') ? '&' : '?';
        return `${baseUrl}${sep}mode=viewer&gameId=${encodeURIComponent(appState.gameInfo.gameId)}`;
      }, [customPublicBaseUrl, appState.gameInfo.gameId]);

      const copyMessengerBriefing = useCallback(() => {
        const text = buildMessengerBriefingText(appState, viewerShareUrl);
        copyToClipboardSafe(text);
        showToast('💬 카카오톡/메신저용 실시간 스코어 브리핑 텍스트가 복사되었습니다!', 'emerald');
      }, [appState, viewerShareUrl, showToast]);

      const qrSvgHtml = useMemo(() => {
        try {
          if (typeof window.qrcode === 'function') {
            const qr = window.qrcode(0, 'M');
            qr.addData(viewerShareUrl);
            qr.make();
            const svgTag = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
            return svgTag.replace('<svg ', '<svg class="w-full h-full" ');
          }
        } catch (e) {}
        const encoded = encodeURIComponent(viewerShareUrl);
        return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encoded}" alt="QR Code" class="w-full h-full object-contain rounded" />`;
      }, [viewerShareUrl]);

      if (viewerUiState.isStandaloneMode) {
        return (
          <div className="fixed inset-0 z-50 flex flex-col bg-slate-950 text-slate-100 font-sans select-none">
            <div className="bg-slate-900/95 border-b border-slate-800 px-3 sm:px-4 py-2 flex flex-wrap items-center justify-between gap-2 text-xs shrink-0">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-rose-500 animate-ping" />
                <span className="font-black tracking-tight text-white">FIBA LIVE 모바일 실시간 중계 뷰어</span>
                <span className="px-2 py-0.5 rounded bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-mono text-[10px]">
                  {cloudStatus.text}
                </span>
              </div>
              <div className="flex items-center gap-1.5">
                <input
                  type="text"
                  value={liveGameIdInput}
                  onChange={(e) => setLiveGameIdInput(e.target.value)}
                  placeholder="매치 코드 입력"
                  className="w-36 sm:w-44 px-2 py-1 rounded bg-slate-950 border border-slate-700 font-mono text-[11px] text-amber-300 font-bold focus:outline-none focus:border-sky-400"
                />
                <button
                  onClick={() => {
                    const cleaned = liveGameIdInput.trim().replace(/[^a-zA-Z0-9_-]/g, '-');
                    if (!cleaned) return;
                    setAppState(prev => ({ ...prev, gameInfo: { ...prev.gameInfo, gameId: cleaned } }));
                    if (mqttClientRef.current && mqttClientRef.current.connected) {
                      const topic = `fiba_pro_live_v2/${cleaned.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
                      mqttClientRef.current.subscribe(topic, { qos: 1 });
                      mqttClientRef.current.publish(`${topic}/req`, JSON.stringify({ type: 'REQ_SYNC', time: Date.now() }), { qos: 0 });
                    }
                    showToast(`📱 [${cleaned}] 실시간 채널을 구독합니다.`, 'sky');
                  }}
                  className="px-2.5 py-1 rounded bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-[11px]"
                >
                  채널 접속
                </button>
                <button
                  onClick={() => setViewerUiState(prev => ({ ...prev, isStandaloneMode: false }))}
                  className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-[11px]"
                >
                  💻 기록석 복귀
                </button>
              </div>
            </div>
            <div className="flex-1 max-w-lg w-full mx-auto flex flex-col min-h-0 overflow-hidden bg-slate-950 border-x border-slate-900">
              <MobileLiveViewer
                appState={appState}
                viewerUiState={viewerUiState}
                setViewerUiState={setViewerUiState}
              />
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#070b14] text-slate-100 font-sans antialiased select-none overflow-x-hidden">
          <div className="min-h-screen flex flex-col justify-between p-2 sm:p-3 gap-2.5 max-w-[1920px] mx-auto">
            <ScoreboardHeader
              appState={appState}
              saveBadgeText={saveBadgeText}
              cloudStatus={cloudStatus}
              isGeneratingPdf={isGeneratingPdf}
              pwaInstallPrompt={pwaInstallPrompt}
              onTriggerPwaInstall={triggerPwaInstall}
              onOpenPwaCenter={() => setActiveModal('PWA_CENTER')}
              onCopyBriefing={copyMessengerBriefing}
              onToggleLiveSync={() => {
                setAppState(prev => {
                  const nextSync = !prev.gameInfo.isLiveSync;
                  showToast(
                    nextSync ? '📡 실시간 라이브 중계 송출이 시작되었습니다.' : '⏸️ 실시간 라이브 중계 송출이 일시 중지되었습니다.',
                    nextSync ? 'emerald' : 'slate'
                  );
                  return { ...prev, gameInfo: { ...prev.gameInfo, isLiveSync: nextSync } };
                });
              }}
              onSetQuarter={(qNum) => {
                setAppState(prev => ({ ...prev, gameInfo: { ...prev.gameInfo, currentQuarter: qNum } }));
                showToast(`⏱️ 현재 쿼터가 ${getQuarterLabel(qNum)}(으)로 변경되었습니다.`, 'sky');
              }}
              onRecordBenchFoul={recordBenchFoul}
              onOpenLiveHub={() => {
                setLiveGameIdInput(appState.gameInfo.gameId);
                setPublicUrlInput(customPublicBaseUrl);
                setActiveModal('LIVE_HUB');
              }}
              onOpenRoster={() => {
                setRosterDraft({
                  homeName: appState.teams.HOME.teamName,
                  awayName: appState.teams.AWAY.teamName,
                  HOME: appState.teams.HOME.players.map(p => ({ number: p.number, name: p.name })),
                  AWAY: appState.teams.AWAY.players.map(p => ({ number: p.number, name: p.name }))
                });
                setActiveModal('ROSTER');
              }}
              onOpenBoxScore={() => setActiveModal('BOXSCORE')}
              onDownloadPdf={downloadOfficialScoresheetPDF}
              onOpenJsonInspector={() => {
                setJsonDraft(JSON.stringify(appState, null, 2));
                setActiveModal('JSON_INSPECTOR');
              }}
              onOpenReset={() => setActiveModal('RESET')}
            />

            <main className="grid grid-cols-12 gap-2.5 flex-1 min-h-0">
              <TeamRosterPanel
                teamKey="HOME"
                teamObj={appState.teams.HOME}
                selectedPlayerRef={selectedPlayerRef}
                onSelectPlayer={(team, playerId) => setSelectedPlayerRef({ team, playerId })}
              />

              <ActionPad
                activePlayer={activePlayer}
                activeTeamKey={selectedPlayerRef.team}
                activeTeamName={appState.teams[selectedPlayerRef.team].teamName}
                canUndo={appState.playByPlay.length > 0}
                onDispatchAction={dispatchAction}
                onUndo={undoLastAction}
              />

              <TeamRosterPanel
                teamKey="AWAY"
                teamObj={appState.teams.AWAY}
                selectedPlayerRef={selectedPlayerRef}
                onSelectPlayer={(team, playerId) => setSelectedPlayerRef({ team, playerId })}

            </main>

            <footer className="bg-slate-900/95 border border-slate-800 rounded-2xl p-2.5 shadow-xl">
              <div className="flex items-center justify-between mb-1.5 px-1">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-extrabold text-slate-200">
                    ⚡ 실시간 경기 기록 로그 (`playByPlay` 이벤트 스택)
                  </span>
                  <span className="px-2 py-0.5 text-[10px] font-mono rounded-full bg-slate-800 text-sky-400 font-bold">
                    {appState.playByPlay.length}건
                  </span>
                </div>
                <span className="text-[11px] text-slate-400 hidden sm:inline">
                  모든 액션은 로컬(`LocalStorage`)에 즉시 보존되며 라이브 중계 시 경량 스냅샷으로 푸시됩니다
                </span>
              </div>

              <div className="h-28 overflow-y-auto space-y-1 pr-1 font-mono text-xs">
                {appState.playByPlay.length === 0 ? (
                  <div className="h-full flex items-center justify-center text-slate-500 text-xs py-8">
                    아직 기록된 플레이가 없습니다. 좌/우 로스터에서 선수를 선택하고 액션 버튼(또는 단축키)을 눌러주세요.
                  </div>
                ) : (
                  appState.playByPlay
                    .slice()
                    .reverse()

          {activeModal === 'RESET' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="text-lg font-black text-white">🔄 새 경기 기록 초기화</h3>
                <p className="text-xs text-slate-300 mt-2 leading-relaxed">
                  현재 저장된 모든 득점, 파울(`foulHistory`), 러닝스코어(`runningScore`), 이벤트 로그(`playByPlay`)를 0으로 초기화하시겠습니까?
                </p>
                <div className="mt-5 flex flex-col sm:flex-row gap-2 justify-end">
                  <button onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold">
                    취소
                  </button>
                  <button
                    onClick={() => {
                      setAppState(prev => {
                        const rebuilt = rebuildStateFromEvents(prev, []);
                        rebuilt.gameInfo.currentQuarter = 1;
                        pushSnapshotToCloud(rebuilt, true);
                        return rebuilt;
                      });
                      setActiveModal(null);
                      showToast('🔄 로스터를 유지하고 모든 경기 기록을 0으로 초기화했습니다.', 'amber');
                    }}
                    className="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold"
                  >
                    로스터 유지하고 기록만 초기화
                  </button>
                  <button
                    onClick={() => {
                      localStorage.removeItem(STORAGE_KEY);
                      const fresh = createInitialAppState();
                      setAppState(fresh);
                      pushSnapshotToCloud(fresh, true);
                      setActiveModal(null);
                      showToast('🔄 전체 초기 상태로 리셋되었습니다.', 'rose');
                    }}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-black"
                  >
                    전체 초기 상태로 리셋
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =====================================================================
              모달 8: FIBA 5반칙 퇴장 / 팀파울 자유투 페널티 실시간 경고 팝업
             ===================================================================== */}
          {fibaAlert && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border-2 border-rose-500 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center space-y-4">
                <div className="text-4xl">🚨</div>
                <h3 className="text-xl font-black text-white">{fibaAlert.title}</h3>
                <p className="text-sm text-slate-200 leading-relaxed">{fibaAlert.desc}</p>
                <button
                  onClick={() => setFibaAlert(null)}
                  className="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-sm shadow-lg"
                >
                  확인 (Enter / Space)
                </button>
              </div>
            </div>
          )}

          {/* 플로팅 토스트 컨테이너 */}
          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div
                key={t.id}
                className={`px-4 py-2.5 rounded-xl bg-slate-900/95 border shadow-xl text-xs font-bold transition-all ${
                  t.color === 'emerald'
                    ? 'border-emerald-500/60 text-emerald-200'
                    : t.color === 'amber'
                    ? 'border-amber-500/60 text-amber-200'
                    : t.color === 'rose'
                    ? 'border-rose-500/60 text-rose-200'
                    : 'border-sky-500/60 text-sky-200'
                }`}
              >
                {t.message}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 애플리케이션 마운트 엔트리 포인트
    const rootElement = document.getElementById('root');
    if (rootElement) {
      rootElement.setAttribute('data-mounted', 'true');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<FibaProScorerMain />);
    }
  </script>

</body></html>
