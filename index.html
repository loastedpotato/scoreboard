      });
      next.gameInfo.quarterScores = { HOME: [0, 0, 0, 0, 0], AWAY: [0, 0, 0, 0, 0] };
      next.gameInfo.teamFouls = { HOME: [0, 0, 0, 0, 0], AWAY: [0, 0, 0, 0, 0] };
      next.runningScore = { HOME: [], AWAY: [] };
      next.playByPlay = [];

      eventsList.forEach(rawEv => {
        const ev = { ...rawEv };
        const tKey = ev.team;
        const teamObj = next.teams[tKey];
        const qIdx = (ev.quarter || 1) - 1;
        const player = teamObj.players.find(p => p.playerId === ev.playerId);
        const code = ev.actionCode;

        if (code === 'BENCH_TF') {
          incrementTeamFoulInPlace(next, tKey, ev.quarter, 1);
        } else if (player) {
          const s = player.stats;
          if (code === '1PM') { s.ftm += 1; s.fta += 1; s.pts += 1; }
          else if (code === '2PM') { s.twopm += 1; s.twopa += 1; s.pts += 2; }
          else if (code === '3PM') { s.threepm += 1; s.threepa += 1; s.pts += 3; }
          else if (code === '1PX') { s.fta += 1; }
          else if (code === '2PX') { s.twopa += 1; }
          else if (code === '3PX') { s.threepa += 1; }
          else if (code === 'DREB') { s.dreb += 1; s.reb += 1; }
          else if (code === 'OREB') { s.oreb += 1; s.reb += 1; }
          else if (code === 'AST') { s.ast += 1; }
          else if (code === 'STL') { s.stl += 1; }
          else if (code === 'BLK') { s.blk += 1; }
          else if (code === 'TOV') { s.tov += 1; }
          else if (code === 'PF' || code === 'UF' || code === 'TF') {
            s.pf += 1;
            player.foulHistory.push(ACTION_META[code].foulCode);
            evaluatePlayerDisqualification(player);
            incrementTeamFoulInPlace(next, tKey, ev.quarter, 1);
          }

          if (ev.pointsDelta > 0) {
            teamObj.totalScore += ev.pointsDelta;
            next.gameInfo.quarterScores[tKey][qIdx] += ev.pointsDelta;
            next.runningScore[tKey].push({
              targetScore: teamObj.totalScore,
              pointsAdded: ev.pointsDelta,
              playerNumber: player.number,
              shotType: code,
              quarter: ev.quarter
            });
          }
        }

        ev.scoreSnapshot = {
          HOME: next.teams.HOME.totalScore,
          AWAY: next.teams.AWAY.totalScore
        };
        next.playByPlay.push(ev);
      });

      return next;
    }

    function computeTeamTotals(state, teamKey) {
      const players = state.teams[teamKey].players;
      const totals = {
        pts: state.teams[teamKey].totalScore,
        twopm: 0, twopa: 0,
        threepm: 0, threepa: 0,
        ftm: 0, fta: 0,
        oreb: 0, dreb: 0, reb: 0,
        ast: 0, stl: 0, blk: 0, tov: 0, pf: 0
      };
      players.forEach(p => {
        const s = p.stats;
        totals.twopm += s.twopm; totals.twopa += s.twopa;
        totals.threepm += s.threepm; totals.threepa += s.threepa;
        totals.ftm += s.ftm; totals.fta += s.fta;
        totals.oreb += s.oreb; totals.dreb += s.dreb; totals.reb += s.reb;
        totals.ast += s.ast; totals.stl += s.stl; totals.blk += s.blk;
        totals.tov += s.tov; totals.pf += s.pf;
      });
      return totals;
    }

    function formatPct(made, att) {
      if (!att) return '0.0%';
      return ((made / att) * 100).toFixed(1) + '%';
    }

    function copyToClipboardSafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) return true;
      } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return true;
      }
      return false;
    }

    function generateServiceWorkerJsString() {
      return `// FIBA Official Scorer PWA Service Worker (Offline-First Asset Caching)
const CACHE_NAME = 'fiba-pro-scorer-pwa-v1';
const PRECACHE_ASSETS = [
  './',
  './index.html',
  './manifest.json',
  'https://cdn.tailwindcss.com',
  'https://unpkg.com/react@18.2.0/umd/react.production.min.js',

  'https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js'
];

self.addEventListener('install', (event) => {
  self.skipWaiting();
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) => {
      return Promise.allSettled(
        PRECACHE_ASSETS.map((url) =>
          fetch(url, { mode: 'cors' })
            .then((res) => {
              if (res && (res.status === 200 || res.type === 'opaque')) {
                return cache.put(url, res);
              }
            })
            .catch(() => {})
        )
      );
    })
  );
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((keys) =>
      Promise.all(
        keys.map((key) => {
          if (key !== CACHE_NAME) {
            return caches.delete(key);
          }
        })
      )
    ).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (event) => {
  const req = event.request;
  if (req.method !== 'GET') return;
  if (req.url.includes('firestore.googleapis.com') || req.url.includes('broker.emqx.io')) {
    return;
  }

  event.respondWith(
    caches.match(req).then((cachedResponse) => {
      const networkFetch = fetch(req)
        .then((networkResponse) => {
          if (networkResponse && (networkResponse.status === 200 || networkResponse.type === 'opaque')) {
            const clone = networkResponse.clone();
            caches.open(CACHE_NAME).then((cache) => cache.put(req, clone)).catch(() => {});
          }
          return networkResponse;
        })
        .catch(() => cachedResponse);

      return cachedResponse || networkFetch;
    })
  );
});
`;

      a.href = url;

              {(() => {
                const hTot = computeTeamTotals(appState, 'HOME');
                const aTot = computeTeamTotals(appState, 'AWAY');
                const metrics = [
                  { label: '총 득점 (PTS)', hVal: hTot.pts, aVal: aTot.pts, hText: hTot.pts, aText: aTot.pts },
                  {
                    label: '2점슛 성공률 (2P%)',
                    hVal: hTot.twopa ? (hTot.twopm / hTot.twopa) * 100 : 0,
                    aVal: aTot.twopa ? (aTot.twopm / aTot.twopa) * 100 : 0,
                    hText: `${hTot.twopm}/${hTot.twopa} (${formatPct(hTot.twopm, hTot.twopa)})`,
                    aText: `${aTot.twopm}/${aTot.twopa} (${formatPct(aTot.twopm, aTot.twopa)})`
                  },
                  {
                    label: '3점슛 성공률 (3P%)',
                    hVal: hTot.threepa ? (hTot.threepm / hTot.threepa) * 100 : 0,
                    aVal: aTot.threepa ? (aTot.threepm / aTot.threepa) * 100 : 0,
                    hText: `${hTot.threepm}/${hTot.threepa} (${formatPct(hTot.threepm, hTot.threepa)})`,
                    aText: `${aTot.threepm}/${aTot.threepa} (${formatPct(aTot.threepm, aTot.threepa)})`
                  },
                  {
                    label: '자유투 성공률 (FT%)',
                    hVal: hTot.fta ? (hTot.ftm / hTot.fta) * 100 : 0,
                    aVal: aTot.fta ? (aTot.ftm / aTot.fta) * 100 : 0,
                    hText: `${hTot.ftm}/${hTot.fta} (${formatPct(hTot.ftm, hTot.fta)})`,
                    aText: `${aTot.ftm}/${aTot.fta} (${formatPct(aTot.ftm, aTot.fta)})`
                  },
                  { label: '리바운드 (REB: 공격/수비)', hVal: hTot.reb, aVal: aTot.reb, hText: `${hTot.reb} (${hTot.oreb}/${hTot.dreb})`, aText: `${aTot.reb} (${aTot.oreb}/${aTot.dreb})` },
                  { label: '어시스트 (AST)', hVal: hTot.ast, aVal: aTot.ast, hText: hTot.ast, aText: aTot.ast },
                  { label: '스틸 / 가로채기 (STL)', hVal: hTot.stl, aVal: aTot.stl, hText: hTot.stl, aText: aTot.stl },
                  { label: '블록슛 (BLK)', hVal: hTot.blk, aVal: aTot.blk, hText: hTot.blk, aText: aTot.blk },
                  { label: '턴오버 (TOV)', hVal: hTot.tov, aVal: aTot.tov, hText: hTot.tov, aText: aTot.tov },
                  { label: '누적 개인파울 (PF)', hVal: hTot.pf, aVal: aTot.pf, hText: hTot.pf, aText: aTot.pf }
                ];

                return metrics.map(m => {
                  const sum = (m.hVal + m.aVal) || 1;
                  const hPct = m.hVal === 0 && m.aVal === 0 ? 50 : Math.round((m.hVal / sum) * 100);
                  const aPct = 100 - hPct;
                  return (
                    <div key={m.label} className="space-y-1">
                      <div className="flex items-center justify-between text-[11px] font-mono">
                        <span className="font-bold text-sky-400">{m.hText}</span>
                        <span className="font-sans font-bold text-slate-300 text-[11px]">{m.label}</span>
                        <span className="font-bold text-orange-400">{m.aText}</span>
                      </div>
                      <div className="w-full h-2 rounded-full bg-slate-900 overflow-hidden flex border border-slate-800">
                        <div className="bg-sky-500 transition-all duration-300" style={{ width: `${hPct}%` }} />
                        <div className="bg-orange-500 transition-all duration-300" style={{ width: `${aPct}%` }} />
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // 5-1. 크기 조절 및 스크롤 보존형 실시간 경기 기록 로그 패널 (PlayByPlayLogDock)
    // ============================================================================
    const LOG_HEIGHT_STORAGE_KEY = 'FIBA_PBP_LOG_HEIGHT_V1';
    const MIN_LOG_HEIGHT = 68;
    const DEFAULT_LOG_HEIGHT = 120;
    const EXPANDED_LOG_HEIGHT = 240;

    function PlayByPlayLogDock({ playByPlay }) {
      const getMaxAllowedHeight = useCallback(() => {
        if (typeof window === 'undefined') return 360;
        return Math.max(200, Math.min(440, Math.floor(window.innerHeight * 0.45)));
      }, []);

      const clampLogHeight = useCallback((val) => {
        const maxH = getMaxAllowedHeight();
        return Math.max(MIN_LOG_HEIGHT, Math.min(maxH, Math.round(val)));
      }, [getMaxAllowedHeight]);

      const [maxLogHeight, setMaxLogHeight] = useState(() => getMaxAllowedHeight());
      const [logHeight, setLogHeight] = useState(() => {
        try {
          const saved = Number(localStorage.getItem(LOG_HEIGHT_STORAGE_KEY));
          if (!Number.isNaN(saved) && saved >= MIN_LOG_HEIGHT) {
            return Math.max(MIN_LOG_HEIGHT, Math.min(360, saved));
          }
        } catch (e) {}
        return DEFAULT_LOG_HEIGHT;
      });
      const [isDragging, setIsDragging] = useState(false);
      const [isScrolledDown, setIsScrolledDown] = useState(false);

      const viewportRef = useRef(null);
      const dragStartRef = useRef({ startY: 0, startHeight: DEFAULT_LOG_HEIGHT });
      const scrollSnapshotRef = useRef({
        scrollTop: 0,
        scrollHeight: 0,
        prevCount: playByPlay.length
      });

      // 높이 변경 시 로컬 스토리지 저장
      useEffect(() => {
        try {
          localStorage.setItem(LOG_HEIGHT_STORAGE_KEY, String(logHeight));
        } catch (e) {}
      }, [logHeight]);

      // 브라우저 창 크기 변경 시 최대 높이 재계산 및 화면 이탈 방지 클램핑
      useEffect(() => {
        const handleWindowResize = () => {
          const nextMax = getMaxAllowedHeight();
          setMaxLogHeight(nextMax);
          setLogHeight(prev => Math.max(MIN_LOG_HEIGHT, Math.min(nextMax, prev)));
        };
        window.addEventListener('resize', handleWindowResize);
        return () => window.removeEventListener('resize', handleWindowResize);
      }, [getMaxAllowedHeight]);

      // 크기 변경 시 기존 스크롤 위치 유지
      const updateHeightWithScrollLock = useCallback((nextHeightOrUpdater) => {
        const el = viewportRef.current;
        const savedScrollTop = el ? el.scrollTop : 0;

        setLogHeight(prev => {
          const rawNext = typeof nextHeightOrUpdater === 'function' ? nextHeightOrUpdater(prev) : nextHeightOrUpdater;
          return clampLogHeight(rawNext);
        });

        requestAnimationFrame(() => {
          if (viewportRef.current) {
            viewportRef.current.scrollTop = savedScrollTop;
          }
        });
      }, [clampLogHeight]);

      // 실시간으로 새 기록이 추가될 때 스크롤 위치 보존 (사용자가 과거 로그를 보고 있을 때 밀림 방지)
      React.useLayoutEffect(() => {
        const el = viewportRef.current;
        if (!el) return;

        const prevSnap = scrollSnapshotRef.current;
        const currentCount = playByPlay.length;
        const newScrollHeight = el.scrollHeight;

        if (currentCount > prevSnap.prevCount) {
          if (prevSnap.scrollTop > 20) {
            const heightDiff = newScrollHeight - prevSnap.scrollHeight;
            if (heightDiff > 0) {
              el.scrollTop = prevSnap.scrollTop + heightDiff;
            }
          } else {
            el.scrollTop = 0;
          }
        }

        scrollSnapshotRef.current = {
          scrollTop: el.scrollTop,
          scrollHeight: el.scrollHeight,
          prevCount: currentCount
        };
      }, [playByPlay]);

      const handleScroll = useCallback((e) => {
        const top = e.currentTarget.scrollTop;
        const sh = e.currentTarget.scrollHeight;
        scrollSnapshotRef.current.scrollTop = top;
        scrollSnapshotRef.current.scrollHeight = sh;
        setIsScrolledDown(top > 24);
      }, []);

      // 마우스 및 터치 드래그 리사이즈 시작
      const startDragResize = useCallback((clientY) => {
        setIsDragging(true);
        dragStartRef.current = {
          startY: clientY,
          startHeight: logHeight
        };
      }, [logHeight]);

      useEffect(() => {
        if (!isDragging) return;

        const handlePointerMove = (clientY) => {
          // 하단 패널이므로 위로 당길수록(clientY 감소) 높이가 커짐
          const deltaY = dragStartRef.current.startY - clientY;
          updateHeightWithScrollLock(dragStartRef.current.startHeight + deltaY);
        };

        const onMouseMove = (e) => handlePointerMove(e.clientY);
        const onTouchMove = (e) => {
          if (e.touches && e.touches[0]) {
            handlePointerMove(e.touches[0].clientY);
          }
        };
        const onStopDrag = () => setIsDragging(false);

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onStopDrag);
        window.addEventListener('touchmove', onTouchMove, { passive: true });
        window.addEventListener('touchend', onStopDrag);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onStopDrag);
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('touchend', onStopDrag);
        };
      }, [isDragging, updateHeightWithScrollLock]);

      // 키보드 접근성 (Tab 포커스 후 방향키/Enter/Space로 크기 조절)
      const handleHandleKeyDown = useCallback((e) => {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          updateHeightWithScrollLock(h => h + 28);
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          updateHeightWithScrollLock(h => h - 28);
        } else if (e.key === 'PageUp' || e.key === 'Home') {
          e.preventDefault();
          updateHeightWithScrollLock(maxLogHeight);
        } else if (e.key === 'PageDown' || e.key === 'End') {
          e.preventDefault();
          updateHeightWithScrollLock(MIN_LOG_HEIGHT);
        } else if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          // 축소 -> 기본 -> 확대 -> 최대 순환
          updateHeightWithScrollLock(h => {
            if (h <= MIN_LOG_HEIGHT + 10) return DEFAULT_LOG_HEIGHT;
            if (h <= DEFAULT_LOG_HEIGHT + 15) return EXPANDED_LOG_HEIGHT;
            if (h < maxLogHeight - 15) return maxLogHeight;
            return MIN_LOG_HEIGHT;
          });
        }
      }, [maxLogHeight, updateHeightWithScrollLock]);

      const reversedLogs = useMemo(() => playByPlay.slice().reverse(), [playByPlay]);

      return (
        <footer className="bg-slate-900/95 border border-slate-800 rounded-2xl px-2.5 pb-2.5 pt-1.5 shadow-xl flex flex-col select-none">
          {/* 상단 드래그 핸들 바 (마우스/터치 드래그 및 키보드 Tab/방향키/Enter 지원) */}
          <div
            role="separator"
            aria-orientation="horizontal"
            aria-label="실시간 경기 기록 로그 창 크기 조절 핸들 (위/아래 방향키 또는 Enter로 조절)"
            aria-valuenow={logHeight}
            aria-valuemin={MIN_LOG_HEIGHT}
            aria-valuemax={maxLogHeight}
            tabIndex={0}
            onMouseDown={(e) => {
              e.preventDefault();
              startDragResize(e.clientY);
            }}
            onTouchStart={(e) => {
              if (e.touches && e.touches[0]) {
                startDragResize(e.touches[0].clientY);
              }
            }}
            onKeyDown={handleHandleKeyDown}
            className="group w-full py-1.5 mb-1 flex flex-col items-center justify-center cursor-ns-resize rounded-lg hover:bg-slate-800/70 focus:outline-none focus:ring-2 focus:ring-sky-400 transition"
            title="드래그하거나 클릭 후 위/아래 방향키(↑/↓), Enter 키로 로그 창 크기를 조절합니다"
          >
            <div className={`w-12 h-1 rounded-full transition-all ${
              isDragging ? 'bg-sky-400 w-20 shadow-sm shadow-sky-400' : 'bg-slate-700 group-hover:bg-sky-400 group-focus:bg-sky-400'
            }`} />
          </div>

          {/* 로그 패널 헤더 및 확대/축소 컨트롤 버튼 그룹 */}
          <div className="flex flex-wrap items-center justify-between gap-2 mb-1.5 px-1">
            <div className="flex items-center gap-2">
              <span className="text-xs font-extrabold text-slate-200">
                ⚡ 실시간 경기 기록 로그 (`playByPlay` 이벤트 스택)
              </span>
              <span className="px-2 py-0.5 text-[10px] font-mono rounded-full bg-slate-800 text-sky-400 font-bold">
                {playByPlay.length}건
              </span>
              <span className="px-1.5 py-0.5 text-[10px] font-mono rounded bg-slate-950 text-slate-400 border border-slate-800">
                높이 {logHeight}px
              </span>
              {isScrolledDown && (
                <button
                  onClick={() => {
                    if (viewportRef.current) {
                      viewportRef.current.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                  }}
                  className="px-2 py-0.5 rounded-full bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/40 text-sky-300 text-[10px] font-bold transition"
                >
                  ⬆️ 최신 기록으로 이동
                </button>
              )}
            </div>

            <div className="flex items-center gap-1">
              <span className="text-[11px] text-slate-400 hidden xl:inline mr-1.5">
                드래그 또는 방향키(↑/↓)로 크기 조절
              </span>
              <button
                type="button"
                onClick={() => updateHeightWithScrollLock(h => h - 36)}
                disabled={logHeight <= MIN_LOG_HEIGHT}
                aria-label="로그 창 높이 축소"
                className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-mono text-xs font-bold border border-slate-700 transition focus:outline-none focus:ring-2 focus:ring-sky-400"
              >
                －
              </button>
              <button
                type="button"
                onClick={() => updateHeightWithScrollLock(h => h + 36)}
                disabled={logHeight >= maxLogHeight}
                aria-label="로그 창 높이 확대"
                className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-mono text-xs font-bold border border-slate-700 transition focus:outline-none focus:ring-2 focus:ring-sky-400"
              >
                ＋
              </button>
              <div className="h-3.5 w-[1px] bg-slate-800 mx-0.5" />
              {[
                { label: '축소', target: MIN_LOG_HEIGHT },
                { label: '기본', target: DEFAULT_LOG_HEIGHT },
                { label: '확대', target: EXPANDED_LOG_HEIGHT },
                { label: '최대', target: maxLogHeight }
              ].map((preset) => {
                const isActive = Math.abs(logHeight - preset.target) <= 8;
                return (
                  <button
                    key={preset.label}
                    type="button"
                    onClick={() => updateHeightWithScrollLock(preset.target)}
                    className={`px-2 py-0.5 rounded text-[11px] font-bold transition focus:outline-none focus:ring-2 focus:ring-sky-400 ${
                      isActive
                        ? 'bg-sky-500 text-slate-950 font-black shadow-sm'
                        : 'bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700/80'
                    }`}
                  >
                    {preset.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* 부드러운 높이 전환(Transition) 및 스크롤 위치가 유지되는 로그 뷰포트 */}
          <div
            ref={viewportRef}
            onScroll={handleScroll}
            style={{ height: `${logHeight}px` }}
            className={`pbp-log-viewport overflow-y-auto space-y-1 pr-1 font-mono text-xs ${
              isDragging ? 'is-dragging' : ''
            }`}
          >
            {reversedLogs.length === 0 ? (
              <div className="h-full flex items-center justify-center text-slate-500 text-xs py-4">
                아직 기록된 플레이가 없습니다. 좌/우 로스터에서 선수를 선택하고 액션 버튼(또는 단축키)을 눌러주세요.
              </div>
            ) : (
              reversedLogs.map((ev, idx) => {
                const isHome = ev.team === 'HOME';
                const meta = ACTION_META[ev.actionCode] || { label: ev.actionCode, badgeClass: 'bg-slate-800 text-slate-300' };
                return (
                  <div
                    key={ev.eventId || idx}
                    className="px-3 py-1.5 rounded-lg bg-slate-950/80 border border-slate-800/80 flex items-center justify-between gap-2"
                  >
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="px-1.5 py-0.5 rounded bg-slate-800 font-mono text-[10px] font-bold text-slate-300">
                        {getQuarterLabel(ev.quarter)}
                      </span>
                      <span className="font-mono text-[10px] text-slate-500">{ev.timestamp}</span>
                      <span className={`font-bold text-xs ${isHome ? 'text-sky-400' : 'text-orange-400'}`}>
                        #{ev.playerNumber} {ev.playerName}
                      </span>
                      <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${meta.badgeClass}`}>
                        {meta.label}
                      </span>
                      {ev.isTeamFoulPenalty && (
                        <span className="px-1.5 py-0.5 rounded bg-rose-600/30 text-rose-300 text-[10px] font-bold">
                          팀파울 페널티
                        </span>
                      )}
                      {ev.isPlayerDisqualified && (
                        <span className="px-1.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-black">
                          퇴장
                        </span>
                      )}
                    </div>
                    <div className="font-mono text-xs font-bold text-slate-300 shrink-0">
                      {ev.scoreSnapshot.HOME} : {ev.scoreSnapshot.AWAY}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </footer>
      );
    }

    // ============================================================================
    // 6. 메인 애플리케이션 컨테이너 컴포넌트 (FibaProScorerMain)
    // ============================================================================
    function FibaProScorerMain() {
      const [appState, setAppState] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (isValidSchema(parsed)) return parsed;
          }
        } catch (e) {}
        return createInitialAppState();
      });

      const [selectedPlayerRef, setSelectedPlayerRef] = useState({
        team: 'HOME',
        playerId: 'HOME_01'
      });

      const [activeModal, setActiveModal] = useState(null);
      const [pwaPreviewTab, setPwaPreviewTab] = useState('GUIDE');
      const [pwaInstallPrompt, setPwaInstallPrompt] = useState(null);
      const [swStatusText, setSwStatusText] = useState('오프라인 로컬 스토리지 보호 활성');
      const [fibaAlert, setFibaAlert] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [saveBadgeText, setSaveBadgeText] = useState('💾 오프라인 자동저장 활성');
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      const [viewerUiState, setViewerUiState] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return {
          activeTab: 'PBP',
          pbpQuarterFilter: 'ALL',
          boxScoreTeam: 'HOME',
          isStandaloneMode: params.get('mode') === 'viewer'
        };
      });

      const [cloudStatus, setCloudStatus] = useState({
        text: '⚡ 실시간 브로드캐스트 준비됨',
        tone: 'sky'
      });
      const [telemetry, setTelemetry] = useState({
        txCount: 0,
        rxCount: 0,
        lastPushTime: '대기 중'
      });
      const [customPublicBaseUrl, setCustomPublicBaseUrl] = useState(() => {
        return localStorage.getItem(CUSTOM_PUBLIC_URL_KEY) || '';
      });

      const [rosterDraft, setRosterDraft] = useState(null);
      const [jsonDraft, setJsonDraft] = useState('');
      const [liveGameIdInput, setLiveGameIdInput] = useState(appState.gameInfo.gameId);
      const [publicUrlInput, setPublicUrlInput] = useState(customPublicBaseUrl);

      const appStateRef = useRef(appState);
      appStateRef.current = appState;
      const viewerModeRef = useRef(viewerUiState.isStandaloneMode);
      viewerModeRef.current = viewerUiState.isStandaloneMode;

      const mqttClientRef = useRef(null);
      const firestoreDbRef = useRef(null);
      const firestoreUserRef = useRef(null);
      const unsubscribeFirestoreRef = useRef(null);
      const liveChannelRef = useRef(null);
      const lastPushedHashRef = useRef('');

      const showToast = useCallback((message, color = 'sky') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, color }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 2700);
      }, []);

      // PWA 설치 프롬프트 및 Service Worker 자동 등록 (http/https 배포 시에만 안전하게 등록)
      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setPwaInstallPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

        try {
          const manifestLink = document.getElementById('pwa-manifest-link');
          if (manifestLink && window.location.protocol === 'file:') {
            const blob = new Blob([generateManifestJsonString()], { type: 'application/manifest+json' });
            manifestLink.href = URL.createObjectURL(blob);
          }
        } catch (e) {}

        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
          navigator.serviceWorker
            .register('./sw.js')
            .then((reg) => {
              setSwStatusText(`🟢 Service Worker 캐싱 활성 (${reg.scope})`);
            })
            .catch(() => {
              setSwStatusText('⚡ 단일 파일 실행 모드 (sw.js 함께 배포 시 오프라인 캐싱 자동 활성화)');
            });
        }

        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      const triggerPwaInstall = useCallback(async () => {
        if (!pwaInstallPrompt) return;
        pwaInstallPrompt.prompt();
        const { outcome } = await pwaInstallPrompt.userChoice;
        if (outcome === 'accepted') {
          showToast('📲 FIBA 공식 기록원 앱 설치가 승인되었습니다!', 'emerald');
          setPwaInstallPrompt(null);
        }
      }, [pwaInstallPrompt, showToast]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlGameId = params.get('gameId');
        if (urlGameId && urlGameId.trim()) {
          setAppState(prev => ({
            ...prev,
            gameInfo: { ...prev.gameInfo, gameId: urlGameId.trim() }
          }));
          setLiveGameIdInput(urlGameId.trim());
        }
      }, []);

      const applyIncomingSnapshot = useCallback((rawStr, isFromSelf) => {
        if (isFromSelf && !viewerModeRef.current) return false;
        try {
          const parsed = typeof rawStr === 'string' ? JSON.parse(rawStr) : rawStr;
          if (parsed && parsed.gameInfo && parsed.teams && Array.isArray(parsed.playByPlay)) {
            setAppState(prev => ({
              gameInfo: parsed.gameInfo,
              teams: parsed.teams,
              runningScore: parsed.runningScore || prev.runningScore || { HOME: [], AWAY: [] },
              playByPlay: parsed.playByPlay
            }));
            const timeLabel = parsed.updatedTimeStr || new Date().toLocaleTimeString('ko-KR', { hour12: false });
            setTelemetry(t => ({ ...t, rxCount: t.rxCount + 1, lastPushTime: timeLabel }));
            setCloudStatus({ text: `🟢 실시간 수신 중 (${parsed.gameInfo.gameId})`, tone: 'emerald' });
            return true;
          }
        } catch (e) {}
        return false;
      }, []);

      const pushSnapshotToCloud = useCallback(async (stateToPush, isForced = false) => {
        if (!stateToPush?.gameInfo?.isLiveSync && !isForced) return false;

        const gameId = (stateToPush.gameInfo.gameId || 'FIBA-20261110-001').trim();
        const clientId = mqttClientRef.current?.options?.clientId || 'react_desk';
        const payload = buildLightweightLivePayload(stateToPush, clientId);
        const serialized = JSON.stringify(payload);

        if (!isForced && serialized === lastPushedHashRef.current) {
          return true;
        }

        let sentSuccess = false;
        if (mqttClientRef.current && mqttClientRef.current.connected) {
          try {
            const cleanId = gameId.replace(/[^a-zA-Z0-9_-]/g, '_');
            const topic = `fiba_pro_live_v2/${cleanId}`;
            mqttClientRef.current.publish(topic, serialized, { qos: 1, retain: true });
            sentSuccess = true;
          } catch (e) {}
        }

        if (firestoreDbRef.current && firestoreUserRef.current && firestoreDbRef.current.doc && firestoreDbRef.current.setDoc) {
          try {
            const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'fiba-pro-scorer-app';
            const { db, doc, setDoc } = firestoreDbRef.current;
            const gameDocRef = doc(db, 'artifacts', envAppId, 'public', 'data', 'fiba_live_games', gameId);
            await setDoc(gameDocRef, {
              gameId,
              updatedAt: Date.now(),
              updatedTimeStr: payload.updatedTimeStr,
              updatedBy: firestoreUserRef.current.uid,
              serializedSnapshot: serialized
            });
            sentSuccess = true;
          } catch (e) {}
        }

        if (sentSuccess) {
          lastPushedHashRef.current = serialized;
          setTelemetry(t => ({ ...t, txCount: t.txCount + 1, lastPushTime: payload.updatedTimeStr }));
          setCloudStatus({ text: `🟢 실시간 송출 중 (${gameId})`, tone: 'emerald' });
          return true;
        }
        return false;
      }, []);

      useEffect(() => {
        if (!appState) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          const now = new Date().toLocaleTimeString('ko-KR', { hour12: false });
          setSaveBadgeText(`💾 오프라인 자동저장 완료 ${now}`);
        } catch (e) {}

        if (liveChannelRef.current && appState.gameInfo.isLiveSync) {
          try {
            liveChannelRef.current.postMessage({
              type: 'FIBA_LIVE_SYNC',
              fullState: appState
            });
          } catch (e) {}
        }

        if (!viewerUiState.isStandaloneMode && appState.gameInfo.isLiveSync) {
          const timer = setTimeout(() => {
            pushSnapshotToCloud(appState, false);
          }, 220);
          return () => clearTimeout(timer);
        }
      }, [appState, viewerUiState.isStandaloneMode, pushSnapshotToCloud]);

      // BroadcastChannel 및 LocalStorage 이벤트 초기화
      useEffect(() => {
        const handleStorageSync = (ev) => {
          if (ev.key === STORAGE_KEY && ev.newValue) {
            try {
              const parsed = JSON.parse(ev.newValue);
              if (parsed && parsed.gameInfo?.gameId === appStateRef.current.gameInfo?.gameId) {
                applyIncomingSnapshot(parsed, false);
              }
            } catch (e) {}
          }
        };
        window.addEventListener('storage', handleStorageSync);

        let ch = null;
        try {
          ch = new BroadcastChannel('fiba_live_scoreboard_channel');
          ch.onmessage = (ev) => {
            if (ev.data && ev.data.type === 'FIBA_LIVE_SYNC' && ev.data.fullState) {
              if (ev.data.fullState.gameInfo?.gameId === appStateRef.current.gameInfo?.gameId) {
                applyIncomingSnapshot(ev.data.fullState, false);
              }
            }
          };
          liveChannelRef.current = ch;
        } catch (e) {}

        return () => {
          window.removeEventListener('storage', handleStorageSync);
          if (ch) {
            try { ch.close(); } catch (e) {}
          }
        };
      }, [applyIncomingSnapshot]);

      // 무설정 WSS MQTT 릴레이 연결 (Canvas 샌드박스에서는 자동 우회)
      useEffect(() => {
        if (!window.mqtt) return;

        if (isRestrictedCanvasEnv()) {
          const gid = appStateRef.current.gameInfo.gameId || 'FIBA-20261110-001';
          setCloudStatus({
            text: `🟢 로컬/브라우저 라이브 동기화 활성 (${gid})`,
            tone: 'emerald'
          });
          return;
        }

        let client = null;
        try {
          const clientId = 'fiba_pwa_' + Math.random().toString(16).slice(2, 10);
          client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId,
            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 4000
          });
          mqttClientRef.current = client;

          const subscribeCurrentGame = () => {
            const gid = appStateRef.current.gameInfo.gameId || 'FIBA-20261110-001';
            const cleanId = gid.replace(/[^a-zA-Z0-9_-]/g, '_');
            const topic = `fiba_pro_live_v2/${cleanId}`;
            client.subscribe(topic, { qos: 1 });
            client.subscribe(`${topic}/req`, { qos: 0 });
            setCloudStatus({ text: `🟢 실시간 클라우드 연결됨 (${gid})`, tone: 'emerald' });

            if (viewerModeRef.current) {
              client.publish(`${topic}/req`, JSON.stringify({ type: 'REQ_SYNC', time: Date.now() }), { qos: 0 });
            } else if (appStateRef.current.gameInfo.isLiveSync) {
              pushSnapshotToCloud(appStateRef.current, true);
            }
          };

          client.on('connect', subscribeCurrentGame);
          client.on('error', () => {
            try { client.end(true); } catch (e) {}
          });
          client.on('message', (topic, message) => {
            try {
              const rawStr = message.toString();
              const parsed = JSON.parse(rawStr);
              if (topic.endsWith('/req') && parsed.type === 'REQ_SYNC') {
                if (!viewerModeRef.current && appStateRef.current.gameInfo.isLiveSync) {
                  pushSnapshotToCloud(appStateRef.current, true);
                }
                return;
              }
              if (parsed && parsed.gameInfo && parsed.teams) {
                const isSelf = parsed.senderClientId === clientId;
                applyIncomingSnapshot(rawStr, isSelf);
              }
            } catch (e) {}
          });
        } catch (err) {
          setCloudStatus({ text: '🟢 로컬 브로드캐스트 모드 활성', tone: 'emerald' });
        }

        return () => {
          if (client) {
            try { client.end(true); } catch (e) {}
          }
        };
      }, [applyIncomingSnapshot, pushSnapshotToCloud]);

      // Firebase Cloud Firestore 연결 (외부 모듈 로더 브릿지 사용)
      const initFirestoreConnection = useCallback(async () => {
        try {
          if (typeof window.__loadFirebaseModules !== 'function') return;
          let configObj = null;
          let isCustom = false;
          const customRaw = localStorage.getItem(CUSTOM_FIREBASE_CFG_KEY);
          if (customRaw) {
            const parsed = JSON.parse(customRaw);
            if (parsed && parsed.projectId) {
              configObj = parsed;
              isCustom = true;
            }
          }
          if (!configObj && typeof __firebase_config !== 'undefined' && __firebase_config) {
            const parsed = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            if (parsed && parsed.projectId) configObj = parsed;
          }
          if (!configObj) return;

          const { appMod, authMod, firestoreMod } = await window.__loadFirebaseModules();
          const { initializeApp, getApps } = appMod;
          const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = authMod;
          const { getFirestore, doc, setDoc, onSnapshot } = firestoreMod;

          const appName = isCustom ? 'fiba-react-custom' : '[DEFAULT]';
          const existing = getApps().find(a => a.name === appName);
          const appInstance = existing || initializeApp(configObj, appName === '[DEFAULT]' ? undefined : appName);
          const auth = getAuth(appInstance);
          const db = getFirestore(appInstance);
          firestoreDbRef.current = { db, doc, setDoc, onSnapshot };

          if (!isCustom && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (user) => {
            firestoreUserRef.current = user;
            if (!user) return;
            const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'fiba-pro-scorer-app';
            const gid = appStateRef.current.gameInfo.gameId || 'FIBA-20261110-001';
            const docRef = doc(db, 'artifacts', envAppId, 'public', 'data', 'fiba_live_games', gid);

            if (unsubscribeFirestoreRef.current) unsubscribeFirestoreRef.current();
            unsubscribeFirestoreRef.current = onSnapshot(
              docRef,
              (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                if (data?.serializedSnapshot) {
                  applyIncomingSnapshot(data.serializedSnapshot, data.updatedBy === user.uid);
                }
              },
              () => {}
            );
          });
        } catch (e) {}
      }, [applyIncomingSnapshot]);

      useEffect(() => {
        initFirestoreConnection();
        return () => {
          if (unsubscribeFirestoreRef.current) unsubscribeFirestoreRef.current();
        };
      }, [initFirestoreConnection]);

      const activePlayer = useMemo(() => {
        const teamObj = appState.teams[selectedPlayerRef.team];
        if (!teamObj) return null;
        return teamObj.players.find(p => p.playerId === selectedPlayerRef.playerId) || teamObj.players[0];
      }, [appState, selectedPlayerRef]);

      // ============================================================================
      // 7. 핵심 농구 기록 디스패처 & Undo 역연산 핸들러
      // ============================================================================
      const dispatchAction = useCallback((actionCode) => {
        setAppState(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          const teamKey = selectedPlayerRef.team;
          const teamObj = next.teams[teamKey];
          const player = teamObj.players.find(p => p.playerId === selectedPlayerRef.playerId) || teamObj.players[0];
          if (!player) return prev;

          if (player.isDisqualified) {
            setFibaAlert({
              title: '🚫 퇴장 선수 기록 불가',
              desc: `${teamObj.teamName} #${player.number} ${player.name} 선수는 이미 [${player.disqualifyReason}] 상태이므로 추가 기록을 입력할 수 없습니다.`
            });
            return prev;
          }

          const curQ = next.gameInfo.currentQuarter;
          const qIdx = curQ - 1;
          const meta = ACTION_META[actionCode];
          if (!meta) return prev;

          let pointsDelta = 0;
          let isTeamFoulPenalty = false;
          let isPlayerDisqualified = false;
          const s = player.stats;

          if (actionCode === '1PM') { s.ftm += 1; s.fta += 1; s.pts += 1; pointsDelta = 1; }
          else if (actionCode === '2PM') { s.twopm += 1; s.twopa += 1; s.pts += 2; pointsDelta = 2; }
          else if (actionCode === '3PM') { s.threepm += 1; s.threepa += 1; s.pts += 3; pointsDelta = 3; }
          else if (actionCode === '1PX') { s.fta += 1; }
          else if (actionCode === '2PX') { s.twopa += 1; }
          else if (actionCode === '3PX') { s.threepa += 1; }
          else if (actionCode === 'DREB') { s.dreb += 1; s.reb += 1; }
          else if (actionCode === 'OREB') { s.oreb += 1; s.reb += 1; }
          else if (actionCode === 'AST') { s.ast += 1; }
          else if (actionCode === 'STL') { s.stl += 1; }
          else if (actionCode === 'BLK') { s.blk += 1; }
          else if (actionCode === 'TOV') { s.tov += 1; }
          else if (actionCode === 'PF' || actionCode === 'UF' || actionCode === 'TF') {
            s.pf += 1;
            player.foulHistory.push(meta.foulCode);
            evaluatePlayerDisqualification(player);
            isPlayerDisqualified = player.isDisqualified;

            const newTeamFouls = incrementTeamFoulInPlace(next, teamKey, curQ, 1);
            if (newTeamFouls >= 5) isTeamFoulPenalty = true;
          }

          if (pointsDelta > 0) {
            teamObj.totalScore += pointsDelta;
            next.gameInfo.quarterScores[teamKey][qIdx] += pointsDelta;
            next.runningScore[teamKey].push({
              targetScore: teamObj.totalScore,
              pointsAdded: pointsDelta,
              playerNumber: player.number,
              shotType: actionCode,
              quarter: curQ
            });
          }

          const nowStr = new Date().toLocaleTimeString('ko-KR', { hour12: false });
          next.playByPlay.push({
            eventId: `evt_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            timestamp: nowStr,
            quarter: curQ,
            team: teamKey,
            playerId: player.playerId,
            playerNumber: player.number,
            playerName: player.name,
            actionCode,
            pointsDelta,
            isTeamFoulPenalty,
            isPlayerDisqualified,
            scoreSnapshot: {
              HOME: next.teams.HOME.totalScore,
              AWAY: next.teams.AWAY.totalScore
            },
            displayText: `[${getQuarterLabel(curQ)}] ${teamObj.teamName} #${player.number} ${player.name} — ${meta.label}`
          });

          if (isPlayerDisqualified && isTeamFoulPenalty) {
            setFibaAlert({
              title: '🚨 선수 퇴장 & 팀 파울 페널티 동시 발생!',
              desc: `#${player.number} ${player.name} 선수가 [${player.disqualifyReason}] 처리되었으며, ${teamObj.teamName} 팀 파울 5개 이상으로 상대 팀에 자유투 2구가 부여됩니다.`
            });
          } else if (isPlayerDisqualified) {
            setFibaAlert({
              title: `🚨 ${player.disqualifyReason}`,
              desc: `${teamObj.teamName} #${player.number} ${player.name} 선수가 파울 누적(${player.foulHistory.join(', ')})으로 즉시 코트에서 퇴장 처리되며 기록 버튼이 잠금됩니다.`
            });
          } else if (isTeamFoulPenalty) {
            setFibaAlert({
              title: '🚨 팀 파울 페널티 (자유투 부여)',
              desc: `${teamObj.teamName}의 ${getQuarterLabel(curQ)} 팀 파울이 5개 이상 누적되었습니다! 지금부터 발생하는 수비 파울 시 상대 팀에 자유투 2구가 부여됩니다.`
            });
          }

          return next;
        });
      }, [selectedPlayerRef]);

      const recordBenchFoul = useCallback((teamKey) => {
        setAppState(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          const curQ = next.gameInfo.currentQuarter;
          const teamObj = next.teams[teamKey];
          const newTeamFouls = incrementTeamFoulInPlace(next, teamKey, curQ, 1);
          const isTeamFoulPenalty = newTeamFouls >= 5;
          const nowStr = new Date().toLocaleTimeString('ko-KR', { hour12: false });

          next.playByPlay.push({
            eventId: `evt_${Date.now()}`,
            timestamp: nowStr,
            quarter: curQ,
            team: teamKey,
            playerId: null,
            playerNumber: 'B',
            playerName: '벤치/감독',
            actionCode: 'BENCH_TF',
            pointsDelta: 0,
            isTeamFoulPenalty,
            isPlayerDisqualified: false,
            scoreSnapshot: {
              HOME: next.teams.HOME.totalScore,
              AWAY: next.teams.AWAY.totalScore
            },
            displayText: `[${getQuarterLabel(curQ)}] ${teamObj.teamName} 벤치/팀 테크니컬 파울`
          });

          if (isTeamFoulPenalty) {
            setFibaAlert({
              title: '🚨 팀 파울 페널티 (자유투 부여)',
              desc: `${teamObj.teamName}의 ${getQuarterLabel(curQ)} 팀 파울이 5개 이상 누적되었습니다!`
            });
          } else {
            showToast(`⚠️ ${teamObj.teamName} 벤치/팀 파울이 기록되었습니다.`, 'amber');
          }

          return next;
        });
      }, [showToast]);

      const undoLastAction = useCallback(() => {
        setAppState(prev => {
          if (!prev.playByPlay.length) return prev;
          const removed = prev.playByPlay[prev.playByPlay.length - 1];
          const remaining = prev.playByPlay.slice(0, -1);
          const rebuilt = rebuildStateFromEvents(prev, remaining);
          showToast(`↩ 실행 취소 완료: ${removed.displayText}`, 'amber');
          return rebuilt;
        });
      }, [showToast]);

      // 글로벌 키보드 단축키 훅 (1,2,3 / Q,W,E 고정 매핑)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
          if (viewerUiState.isStandaloneMode || activeModal) return;

          if (fibaAlert) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
              e.preventDefault();
              setFibaAlert(null);
            }
            return;
          }

          if (e.key === 'Backspace') {
            e.preventDefault();
            undoLastAction();
            return;
          }

          const key = e.key.toUpperCase();
          const keyMap = {
            '1': '1PM', '2': '2PM', '3': '3PM',
            'Q': '1PX', 'W': '2PX', 'E': '3PX',
            'R': 'DREB', 'O': 'OREB', 'A': 'AST',
            'S': 'STL', 'B': 'BLK', 'T': 'TOV',
            'F': 'PF', 'U': 'UF', 'G': 'TF'
          };

          if (keyMap[key]) {
            e.preventDefault();
            dispatchAction(keyMap[key]);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [viewerUiState.isStandaloneMode, activeModal, fibaAlert, dispatchAction, undoLastAction]);

      // ============================================================================
      // 8. PDF 다운로드 (A4 Portrait 1페이지 자동 피팅) & CSV(Excel) 다운로드
      // ============================================================================
      const downloadOfficialScoresheetPDF = useCallback(async () => {
        if (!window.html2pdf) {
          showToast('⏳ PDF 엔진 로드 중입니다. 잠시 후 다시 시도해주세요.', 'amber');
          return;
        }

        setIsGeneratingPdf(true);
        showToast('📄 A4 세로형 1페이지 맞춤 공식 기록지 PDF를 생성 중입니다...', 'sky');

        const captureHost = document.createElement('div');
        captureHost.style.cssText = 'position:fixed; top:0; left:0; width:762px; background:#ffffff; z-index:99999; padding:0; margin:0; overflow:visible; box-sizing:border-box;';

        const sheetTarget = document.createElement('div');
        sheetTarget.style.cssText = 'width:762px; background:#ffffff; color:#0f172a; margin:0; padding:0; box-sizing:border-box;';
        sheetTarget.innerHTML = buildOfficialPaperScoresheetHTML(appState);

        captureHost.appendChild(sheetTarget);
        document.body.appendChild(captureHost);

        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          await new Promise(resolve => setTimeout(resolve, 200));

          const fullWidth = sheetTarget.scrollWidth || 762;
          const fullHeight = sheetTarget.scrollHeight || 1060;

          const worker = window.html2pdf().set({
            html2canvas: {
              scale: 2,
              useCORS: true,
              logging: false,
              backgroundColor: '#ffffff',
              x: 0,
              y: 0,
              scrollX: 0,
              scrollY: 0,
              width: fullWidth,
              height: fullHeight,
              windowWidth: fullWidth,
              windowHeight: fullHeight
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          }).from(sheetTarget);

          const canvas = await worker.toCanvas().get('canvas');
          const imgData = canvas.toDataURL('image/jpeg', 0.98);

          const pdf = await worker.toPdf().get('pdf');
          const pageW = 210;
          const pageH = 297;
          const margin = 6;
          const maxW = pageW - margin * 2;
          const maxH = pageH - margin * 2;

          const imgAspect = canvas.width / canvas.height;
          let renderW = maxW;
          let renderH = renderW / imgAspect;

          if (renderH > maxH) {
            renderH = maxH;
            renderW = renderH * imgAspect;
          }

          const offsetX = (pageW - renderW) / 2;
          const offsetY = margin;

          pdf.deletePage(1);
          pdf.addPage('a4', 'portrait');
          pdf.addImage(imgData, 'JPEG', offsetX, offsetY, renderW, renderH);
          pdf.save(`${appState.gameInfo.gameId}_FIBA_OFFICIAL_SCORESHEET.pdf`);

          showToast('✅ A4 세로 1페이지 공식 기록지 PDF 저장이 완료되었습니다!', 'emerald');
        } catch (err) {
          setActiveModal('PREVIEW_A4');
          showToast('⚠️ 프리뷰 창에서 프린터 인쇄(PDF로 저장)를 이용해주세요.', 'amber');
        } finally {
          if (captureHost && captureHost.parentNode) {
            captureHost.parentNode.removeChild(captureHost);
          }
          setIsGeneratingPdf(false);
        }
      }, [appState, showToast]);

      const exportBoxScoreCSV = useCallback(() => {
        const rows = [
          ['TEAM', 'NO', 'NAME', 'PTS', '2PM', '2PA', '3PM', '3PA', 'FTM', 'FTA', 'OREB', 'DREB', 'REB', 'AST', 'STL', 'BLK', 'TOV', 'PF', 'FOUL_HISTORY']
        ];
        ['HOME', 'AWAY'].forEach(tKey => {
          const teamName = appState.teams[tKey].teamName;
          appState.teams[tKey].players.forEach(p => {
            const s = p.stats;

                  </div>

                  <div className="pt-2 border-t border-slate-800 flex items-center justify-between">
                    <span className="text-[11px] font-mono text-slate-400">
                      경량 스냅샷: ~{(new Blob([JSON.stringify(buildLightweightLivePayload(appState))]).size / 1024).toFixed(1)} KB
                    </span>
                    <button
                      onClick={() => setActiveModal(null)}
                      className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold"
                    >
                      기록석으로 돌아가기
                    </button>
                  </div>
                </div>

                <div className="lg:w-7/12 p-4 sm:p-6 bg-[#070b14] flex flex-col items-center justify-center overflow-y-auto">
                  <div className="w-full max-w-[410px] bg-slate-950 border-[6px] border-slate-800 rounded-[2.2rem] shadow-2xl overflow-hidden flex flex-col h-[640px]">
                    <div className="bg-slate-900 px-5 py-2 flex items-center justify-between text-[10px] font-mono text-slate-400 border-b border-slate-800/80 shrink-0">
                      <span>FIBA LIVE SCOREBOARD</span>
                      <div className="w-14 h-3 bg-slate-950 rounded-full" />
                      <span className="text-emerald-400 font-bold">● LIVE SYNC</span>
                    </div>
                    <MobileLiveViewer
                      appState={appState}
                      viewerUiState={viewerUiState}
                      setViewerUiState={setViewerUiState}
                    />
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* =====================================================================
              모달 5: QR 확대 모달
             ===================================================================== */}
          {activeModal === 'QR_ZOOM' && (
            <div
              onClick={() => setActiveModal('LIVE_HUB')}
              className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4"
              >
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <span className="text-sm font-black text-white">📱 모바일 실시간 뷰어 QR 스캔</span>
                  <button onClick={() => setActiveModal('LIVE_HUB')} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                </div>
                <div
                  className="w-64 h-64 mx-auto bg-white p-3 rounded-2xl shadow-inner flex items-center justify-center"
                  dangerouslySetInnerHTML={{ __html: qrSvgHtml }}
                />
                <div className="space-y-1">
                  <div className="font-mono text-xs font-bold text-amber-300">MATCH ID : {appState.gameInfo.gameId}</div>
                  <p className="text-[11px] text-slate-400 leading-relaxed">
                    스마트폰 기본 카메라 앱으로 위 QR 코드를 비추면 실시간 문자중계 및 박스스코어 뷰어로 즉시 연결됩니다.
                  </p>
                </div>
                <button
                  onClick={() => setActiveModal('LIVE_HUB')}
                  className="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs"
                >
                  닫기
                </button>
              </div>
            </div>
          )}

          {/* =====================================================================
              모달 6: JSON 스키마 인스펙터 및 백업/복원
             ===================================================================== */}
          {activeModal === 'JSON_INSPECTOR' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl">
                <div className="px-5 py-3.5 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h3 className="text-base font-black text-white">🗂️ FIBA 표준 JSON 상태 스키마 인스펙터 (`appState`)</h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      `gameInfo`, `teams`, `runningScore`, `playByPlay` 4대 루트 스키마가 실시간 직렬화됩니다.
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => {
                        copyToClipboardSafe(jsonDraft);
                        showToast('📋 JSON 스키마 전체 데이터가 복사되었습니다.', 'sky');
                      }}
                      className="px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs"
                    >
                      📋 JSON 전체 복사
                    </button>
                    <button
                      onClick={() => {
                        try {
                          const parsed = JSON.parse(jsonDraft);
                          if (!isValidSchema(parsed)) {
                            showToast('⚠️ 유효하지 않은 FIBA JSON 스키마 구조입니다.', 'rose');
                            return;
                          }
                          setAppState(parsed);
                          setActiveModal(null);
                          showToast('✅ JSON 상태가 성공적으로 복원 및 적용되었습니다.', 'emerald');
                        } catch (e) {
                          showToast('⚠️ JSON 구문 오류로 인해 복원할 수 없습니다.', 'rose');
                        }
                      }}
                      className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs"
                    >
                      📥 편집한 JSON 복원/적용
                    </button>
                    <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white text-xl font-bold px-2">✕</button>
                  </div>
                </div>
                <div className="p-4 flex-1 overflow-hidden flex flex-col gap-3">
                  <textarea
                    value={jsonDraft}
                    onChange={(e) => setJsonDraft(e.target.value)}
                    spellCheck={false}
                    className="w-full flex-1 min-h-[380px] p-3 rounded-xl bg-slate-950 border border-slate-800 font-mono text-[11px] text-emerald-300 focus:outline-none focus:border-amber-400 leading-relaxed"
                  />
                </div>
              </div>
            </div>
          )}

          {/* =====================================================================
              모달 7: 새 경기 초기화 모달
             ===================================================================== */}
          {activeModal === 'RESET' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="text-lg font-black text-white">🔄 새 경기 기록 초기화</h3>
                <p className="text-xs text-slate-300 mt-2 leading-relaxed">
                  현재 저장된 모든 득점, 파울(`foulHistory`), 러닝스코어(`runningScore`), 이벤트 로그(`playByPlay`)를 0으로 초기화하시겠습니까?
                </p>
                <div className="mt-5 flex flex-col sm:flex-row gap-2 justify-end">
                  <button onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold">
                    취소
                  </button>
                  <button
                    onClick={() => {
                      setAppState(prev => {
                        const rebuilt = rebuildStateFromEvents(prev, []);
                        rebuilt.gameInfo.currentQuarter = 1;
                        pushSnapshotToCloud(rebuilt, true);
                        return rebuilt;
                      });
                      setActiveModal(null);
                      showToast('🔄 로스터를 유지하고 모든 경기 기록을 0으로 초기화했습니다.', 'amber');
                    }}
                    className="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold"
                  >
                    로스터 유지하고 기록만 초기화
                  </button>
                  <button
                    onClick={() => {
                      localStorage.removeItem(STORAGE_KEY);
                      const fresh = createInitialAppState();
                      setAppState(fresh);
                      pushSnapshotToCloud(fresh, true);
                      setActiveModal(null);
                      showToast('🔄 전체 초기 상태로 리셋되었습니다.', 'rose');
                    }}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-black"
                  >
                    전체 초기 상태로 리셋
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =====================================================================
              모달 8: FIBA 5반칙 퇴장 / 팀파울 자유투 페널티 실시간 경고 팝업
             ===================================================================== */}
          {fibaAlert && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border-2 border-rose-500 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center space-y-4">
                <div className="text-4xl">🚨</div>
                <h3 className="text-xl font-black text-white">{fibaAlert.title}</h3>
                <p className="text-sm text-slate-200 leading-relaxed">{fibaAlert.desc}</p>
                <button
                  onClick={() => setFibaAlert(null)}
                  className="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-sm shadow-lg"
                >
                  확인 (Enter / Space)
                </button>
              </div>
            </div>
          )}

          {/* 플로팅 토스트 컨테이너 */}
          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div
                key={t.id}
                className={`px-4 py-2.5 rounded-xl bg-slate-900/95 border shadow-xl text-xs font-bold transition-all ${
                  t.color === 'emerald'
                    ? 'border-emerald-500/60 text-emerald-200'
                    : t.color === 'amber'
                    ? 'border-amber-500/60 text-amber-200'
                    : t.color === 'rose'
                    ? 'border-rose-500/60 text-rose-200'
                    : 'border-sky-500/60 text-sky-200'
                }`}
              >
                {t.message}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 애플리케이션 마운트 엔트리 포인트
    const rootElement = document.getElementById('root');
    if (rootElement) {
      rootElement.setAttribute('data-mounted', 'true');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<FibaProScorerMain />);
    }
  </script>

</body></html>
